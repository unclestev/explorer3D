<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yorkville Explorer</title>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        /* Removed touch-action: none from body so pinch-to-zoom works natively! */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #111;
            user-select: none; -webkit-user-select: none; 
        }
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        /* Loading Screen */
        #loading {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a; color: #38bdf8; z-index: 999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; transition: opacity 0.5s;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid rgba(56, 189, 248, 0.3);
            border-top-color: #38bdf8; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Smaller Top-Down 2D Car - Reduced size for better field of view */
        #car-container {
            position: absolute; top: 50%; left: 50%; width: 40px; height: 70px;
            transform: translate(-50%, -50%) rotate(0deg) scale(1);
            pointer-events: none; z-index: 10; transform-origin: center center;
            will-change: transform;
        }
        .explorer-body {
            position: absolute; width: 30px; height: 56px; left: 5px; top: 7px;
            background: linear-gradient(135deg, #1b365d, #0d1b2a);
            border-radius: 8px 8px 6px 6px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.6), inset 0 1px 3px rgba(255,255,255,0.3);
            border: 1px solid #081018;
        }
        .explorer-roof {
            position: absolute; width: 22px; height: 28px; left: 4px; top: 14px;
            background: #111; border-radius: 4px; border: 1px solid #333;
        }
        .windshield {
            position: absolute; width: 20px; height: 8px; left: 1px; top: 2px;
            background: linear-gradient(to bottom, #7ec8e3, #2a6f97); border-radius: 2px 2px 1px 1px;
        }
        .rear-window {
            position: absolute; width: 20px; height: 6px; left: 1px; top: 18px;
            background: linear-gradient(to top, #7ec8e3, #2a6f97); border-radius: 1px 1px 2px 2px;
        }
        .wheel { position: absolute; width: 6px; height: 14px; background: #111; border-radius: 2px; border: 1px solid #333; }
        .wheel-fl { top: 10px; left: 0px; } .wheel-fr { top: 10px; right: 0px; }
        .wheel-rl { top: 40px; left: 0px; } .wheel-rr { top: 40px; right: 0px; }
        .headlight {
            position: absolute; width: 5px; height: 3px; background: #fff; top: 2px; border-radius: 1px;
            box-shadow: 0 0 6px #fff;
        }
        .hl-left { left: 2px; } .hl-right { right: 2px; }
        .taillight {
            position: absolute; width: 6px; height: 3px; background: #990000; bottom: 2px; border-radius: 1px;
        }
        .tl-left { left: 3px; } .tl-right { right: 3px; }
        .braking .taillight { background: #ff2222; box-shadow: 0 0 8px #ff0000; }

        /* HUD */
        #hud {
            position: absolute; top: 15px; left: 15px; max-width: 240px;
            background: rgba(15, 23, 42, 0.85); color: white; padding: 12px 16px;
            border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.1);
            z-index: 100; pointer-events: none;
        }
        #hud h1 { margin: 0 0 4px 0; font-size: 14px; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px;}
        #hud p { margin: 3px 0; font-size: 12px; color: #cbd5e1; }
        #speed-display { font-size: 20px; font-weight: bold; color: #fff; }

        /* Controls (Touch action none applied specifically here so it doesn't break map zoom) */
        #touch-controls {
            position: absolute; bottom: 20px; left: 0; right: 0;
            display: flex; justify-content: space-between; padding: 0 20px;
            z-index: 100; touch-action: none;
        }
        .control-group { display: flex; gap: 15px; pointer-events: auto; }
        .touch-btn {
            width: 70px; height: 70px; border-radius: 50%; color: white; font-size: 18px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4); cursor: pointer;
            user-select: none; transition: transform 0.1s;
        }
        .touch-btn:active { transform: scale(0.92); }
        .btn-steer { background: rgba(15, 23, 42, 0.85); border: 2px solid rgba(56, 189, 248, 0.6); }
        #btn-gas { background: rgba(22, 101, 52, 0.9); border: 2px solid #22c55e; }
        #btn-brake { background: rgba(127, 29, 29, 0.9); border: 2px solid #ef4444; }

        @media (max-height: 500px) {
            .touch-btn { width: 55px; height: 55px; font-size: 14px; }
            #touch-controls { bottom: 10px; }
            #hud { top: 10px; left: 10px; padding: 8px 12px; }
        }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <div>Loading Yorkville Map...</div>
    </div>

    <div id="map"></div>

    <div id="hud">
        <h1>Yorkville Explorer</h1>
        <p><span id="speed-display">0</span> MPH</p>
        <p>Loc: <strong id="location-display">Downtown Yorkville</strong></p>
        <p>Area: <span id="area-display">Yorkville, Kendall County</span></p>
    </div>

    <!-- 2D Top-Down Vehicle -->
    <div id="car-container">
        <div class="explorer-body" id="car-mesh">
            <div class="headlight hl-left"></div>
            <div class="headlight hl-right"></div>
            <div class="taillight tl-left"></div>
            <div class="taillight tl-right"></div>
            <div class="explorer-roof">
                <div class="windshield"></div>
                <div class="rear-window"></div>
            </div>
        </div>
        <div class="wheel wheel-fl"></div>
        <div class="wheel wheel-fr"></div>
        <div class="wheel wheel-rl"></div>
        <div class="wheel wheel-rr"></div>
    </div>

    <div id="touch-controls">
        <div class="control-group">
            <div class="touch-btn btn-steer" id="btn-left">◀</div>
            <div class="touch-btn btn-steer" id="btn-right">▶</div>
        </div>
        <div class="control-group">
            <div class="touch-btn" id="btn-brake">REV</div>
            <div class="touch-btn" id="btn-gas">GAS</div>
        </div>
    </div>

    <script>
        // Init MapLibre - 2D Top-Down setup (pitch: 0, bearing: 0)
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/liberty', 
            center: [-88.446, 41.642], 
            zoom: 17.5,
            pitch: 0,
            bearing: 0,
            interactive: true,
            scrollZoom: true,       // Enable Mouse Wheel Zoom
            touchZoomRotate: true,  // Enable native Pinch to Zoom!
            dragPan: false,         // Lock manual panning (car moves the map)
            dragRotate: false,      // Lock manual rotation
            keyboard: false         
        });

        // Throttle-based Physics State
        let car = { 
            lng: -88.446, 
            lat: 41.642, 
            throttle: 0, 
            maxThrottle: 1.0, 
            acceleration: 0.04, 
            friction: 0.94, 
            angle: 0, // Visual rotation on screen
            turnSpeed: 4.5 
        };

        // SPEED MULTIPLIER (Dramatically faster than before)
        const BASE_SPEED = 0.00003; 
        const BASE_ZOOM = 17.5;
        
        const keys = { W: false, A: false, S: false, D: false };

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (['w', 'W', 'ArrowUp'].includes(e.key)) keys.W = true;
            if (['a', 'A', 'ArrowLeft'].includes(e.key)) keys.A = true;
            if (['s', 'S', 'ArrowDown'].includes(e.key)) keys.S = true;
            if (['d', 'D', 'ArrowRight'].includes(e.key)) keys.D = true;
        });
        window.addEventListener('keyup', (e) => {
            if (['w', 'W', 'ArrowUp'].includes(e.key)) keys.W = false;
            if (['a', 'A', 'ArrowLeft'].includes(e.key)) keys.A = false;
            if (['s', 'S', 'ArrowDown'].includes(e.key)) keys.S = false;
            if (['d', 'D', 'ArrowRight'].includes(e.key)) keys.D = false;
        });

        // Touch Controls
        function bindTouch(id, keyName) {
            const el = document.getElementById(id);
            if(!el) return;
            const press = (e) => { e.preventDefault(); keys[keyName] = true; };
            const release = (e) => { e.preventDefault(); keys[keyName] = false; };
            el.addEventListener('touchstart', press, {passive: false});
            el.addEventListener('touchend', release, {passive: false});
            el.addEventListener('mousedown', press);
            el.addEventListener('mouseup', release);
            el.addEventListener('mouseleave', release);
        }
        bindTouch('btn-left', 'A');
        bindTouch('btn-right', 'D');
        bindTouch('btn-gas', 'W');
        bindTouch('btn-brake', 'S');

        const carContainer = document.getElementById('car-container');
        const carMesh = document.getElementById('car-mesh');
        let lastTransform = "";

        function updateGame() {
            // Steering visually turns the car
            if (keys.A && Math.abs(car.throttle) > 0.01) car.angle -= car.turnSpeed * (car.throttle > 0 ? 1 : -1);
            if (keys.D && Math.abs(car.throttle) > 0.01) car.angle += car.turnSpeed * (car.throttle > 0 ? 1 : -1);

            let isBraking = false;

            // Gas / Reverse
            if (keys.W) {
                car.throttle += car.acceleration;
                if (car.throttle > car.maxThrottle) car.throttle = car.maxThrottle;
            } else if (keys.S) {
                car.throttle -= car.acceleration * 1.5;
                if (car.throttle < -0.4) car.throttle = -0.4;
                isBraking = true;
            } else {
                car.throttle *= car.friction; 
                if (Math.abs(car.throttle) < 0.001) car.throttle = 0;
            }

            if (isBraking) carMesh.classList.add('braking');
            else carMesh.classList.remove('braking');

            const currentZoom = map.getZoom();

            // Move the coordinates
            if (car.throttle !== 0) {
                // Adjust speed based on how far zoomed out you are
                const zoomMultiplier = Math.pow(2, BASE_ZOOM - currentZoom); 
                const effectiveSpeed = car.throttle * BASE_SPEED * zoomMultiplier;
                
                const rad = car.angle * (Math.PI / 180);
                const latCorrection = Math.cos(car.lat * (Math.PI / 180)); // Mercator correction
                
                // 0 degrees is facing UP (North), so Lat increases, Lng stays 0
                car.lat += Math.cos(rad) * effectiveSpeed;
                car.lng += (Math.sin(rad) * effectiveSpeed) / latCorrection; 
            }

            // Move Map (No bearing passed, map stays locked North)
            if(map.loaded()){
                map.jumpTo({ center: [car.lng, car.lat] });
            }

            // Update Vehicle CSS Transform (Rotate & Scale)
            const zoomDiff = currentZoom - 17.5;
            const carScale = Math.max(0.4, Math.pow(1.15, zoomDiff)); // Prevents shrinking too small
            const newTransform = `translate(-50%, -50%) rotate(${car.angle}deg) scale(${carScale})`;
            if (newTransform !== lastTransform) {
                carContainer.style.transform = newTransform;
                lastTransform = newTransform;
            }

            // Update Speed HUD
            const displayMph = Math.round(Math.abs(car.throttle) * 75); 
            document.getElementById('speed-display').innerText = displayMph;

            // Area logic
            let locName = "Local Roads";
            let cityName = "Yorkville";
            if (car.lng > -88.380 && car.lat >= 41.640) cityName = "Oswego";
            else if (car.lng < -88.485) cityName = "Plano";
            else {
                if (car.lng >= -88.455 && car.lng <= -88.440 && car.lat >= 41.638 && car.lat <= 41.648) locName = "Downtown Yorkville";
                else if (car.lng >= -88.465 && car.lng < -88.445 && car.lat > 41.648 && car.lat <= 41.665) locName = "YHS Campus";
                else if (car.lng >= -88.410 && car.lng <= -88.380 && car.lat >= 41.628 && car.lat < 41.645) locName = "Fields of Farm Colony"; 
                else if (car.lng >= -88.480 && car.lng < -88.446 && car.lat >= 41.600 && car.lat <= 41.632) locName = "Country Hills";
            }
            document.getElementById('location-display').innerText = locName;
            document.getElementById('area-display').innerText = `${cityName}, Kendall County`;

            requestAnimationFrame(updateGame);
        }

        function startGameLoop() {
            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                requestAnimationFrame(updateGame);
            }, 500);
        }

        map.on('load', startGameLoop);
        
        // Failsafe
        setTimeout(() => {
            if (document.getElementById('loading').style.display !== 'none') {
                startGameLoop();
            }
        }, 3000);

        window.addEventListener('resize', () => map.resize());
    </script>
</body>
</html>
