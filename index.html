<script>
(function(){
  function show(m){var d=document.getElementById('dbg');if(!d){d=document.createElement('pre');d.id='dbg';
    d.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;max-height:40%;overflow:auto;z-index:9999;margin:0;padding:10px;background:#7f1d1d;color:#fff;font:12px monospace;white-space:pre-wrap;border-radius:8px';
    document.body.appendChild(d);} d.textContent+=m+"\n";}
  var seenE={}, nE=0;
  function once(m){ var k=String(m).slice(0,80); if(seenE[k]||nE>=8) return; seenE[k]=1; nE++; show(m); }
  window.addEventListener('error',function(e){
    // bare cross-origin "Script error." carries no file/line/stack: log it, don't show a useless box
    if(e.message==='Script error.' && !e.filename && !e.lineno && !e.error){ console.warn('Opaque cross-origin "Script error." (no details available)',e); return; }
    once('ERROR: '+e.message+(e.filename?' @ '+e.filename.split('/').slice(-3).join('/')+':'+e.lineno+':'+e.colno:'')+(e.message==='Script error.'?' (hidden by the browser: it came from a library on another domain; check the console for details)':'')+(e.lineno?' (line '+e.lineno+')':'')+(e.error&&e.error.stack?'\n'+e.error.stack.split('\n').slice(0,5).join('\n'):''));});
  window.addEventListener('unhandledrejection',function(e){once('PROMISE: '+(e.reason&&e.reason.message||e.reason));});
  window.addEventListener('load',function(){
    if(typeof maplibregl==='undefined')show('MapLibre failed to load from jsdelivr, cdnjs and unpkg. Check your network or ad blocker.');
    if(typeof THREE==='undefined')show('Three.js failed to load from cdnjs.cloudflare.com');
  });
})();
</script>
<script>
/* ---------- BATTERY SAVER (on by default on phones) ----------
   30 fps cap, lower render resolution, flat terrain, fewer trees, slower minimap, and no redraw while parked. */
let POWER=false;
try{ const v=localStorage.getItem('ydPower'); POWER = v===null ? matchMedia('(pointer: coarse)').matches : v==='1'; }
catch(e){ try{ POWER=matchMedia('(pointer: coarse)').matches; }catch(_){} }
const mapPR=on=>Math.min(devicePixelRatio||1, on?1.5:2);
// Start on Route 47 just south of Raging Waves waterpark, pointed at it
const RAGING_WAVES={lng:-88.44446,lat:41.6989};
const START=(()=>{ const lng=-88.4474, lat=41.6955, dN=(RAGING_WAVES.lat-lat)*111320, dE=(RAGING_WAVES.lng-lng)*111320*Math.cos(lat*Math.PI/180);
  return {lng,lat,hdg:(Math.atan2(dE,dN)*180/Math.PI+360)%360}; })();
/* ---------- MAP ---------- */
const map = new maplibregl.Map({ pixelRatio:mapPR(POWER),
  container:'map', style:'https://tiles.openfreemap.org/styles/liberty',
  center:[START.lng,START.lat], bearing:START.hdg, zoom:19.3, pitch:68, maxPitch:80, maxZoom:22,
  interactive:false, fadeDuration:0, attributionControl:{compact:true}
});
let roadIds=[], blockIds=[], waterIds=[], bridgeIds=[], hideIds=[];
/* house numbers: only within HOUSE_R metres of the car, never overlapping */
let houseIds=[]; const HOUSE_R=280; let hLat=null,hLng=null;
function updateHouseFilter(force){
  if(!houseIds.length) return;
  if(!force && hLat!==null && meters(hLat,hLng,S.lat,S.lng)<40) return;
  hLat=S.lat; hLng=S.lng;
  const ring=[], dLat=HOUSE_R/111320, dLng=HOUSE_R/(111320*Math.cos(rad(S.lat)));
  for(let i=0;i<=24;i++){ const t=i/24*2*Math.PI; ring.push([S.lng+Math.cos(t)*dLng, S.lat+Math.sin(t)*dLat]); }
  const f=['within',{type:'Polygon',coordinates:[ring]}];
  houseIds.forEach(id=>{ try{ map.setFilter(id,f); }catch(e){ try{ map.setLayoutProperty(id,'visibility','none'); }catch(_){} } });
}
function inRing(x,y,r){ let c=false; for(let i=0,j=r.length-1;i<r.length;j=i++){ const xi=r[i][0],yi=r[i][1],xj=r[j][0],yj=r[j][1]; if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi)) c=!c; } return c; }
function inPoly(x,y,pl){ if(!inRing(x,y,pl[0])) return false; for(let k=1;k<pl.length;k++) if(inRing(x,y,pl[k])) return false; return true; }
function contains(g,x,y){ if(!g) return false; if(g.type==='Polygon') return inPoly(x,y,g.coordinates); if(g.type==='MultiPolygon') return g.coordinates.some(pl=>inPoly(x,y,pl)); return false; }
const destroyed=[];
// The style's own building filter may use legacy syntax (e.g. ["!has","hide_3d"]); it can't be nested inside an
// expression ["all",...] (MapLibre rejects it with a validation error), so convert it to an expression first.
const CMP=['==','!=','<','>','<=','>='];
function isLegacy(f){ if(!Array.isArray(f)) return false; const o=f[0];
  if(o==='all'||o==='any') return f.slice(1).some(isLegacy);
  if(o==='none'||o==='!has') return true;
  if(CMP.includes(o)) return typeof f[1]==='string';
  if(o==='in'||o==='!in') return typeof f[1]==='string' && (o==='!in'||f.length!==3||!Array.isArray(f[2]));
  return false; }
function toExpr(f){ if(!isLegacy(f)) return f; const o=f[0];
  if(o==='all'||o==='any') return [o,...f.slice(1).map(toExpr)];
  if(o==='none') return ['!',['any',...f.slice(1).map(toExpr)]];
  const k=f[1], g=k==='$type'?['geometry-type']:k==='$id'?['id']:['get',k];
  if(o==='has') return k==='$id'?['!=',['id'],null]:['has',k];
  if(o==='!has') return ['!',toExpr(['has',k])];
  if(o==='in'||o==='!in'){ const e=['in',g,['literal',f.slice(2)]]; return o==='in'?e:['!',e]; }
  return [o,g,f[2]]; }
const origFilters={};   // layer id -> original filter (as expression) for every building extrusion layer
/* OpenFreeMap packs many neighbouring buildings into ONE feature (a MultiPolygon with one id).
   Hiding that id would flatten the whole block, so after hiding it we redraw every other building
   of the group from a GeoJSON layer ('rebuilt-3d') and leave out only the one the car hit. */
let bSrc='openmaptiles';
const rebuilt={type:'FeatureCollection',features:[]}, rebuiltKeys=new Set(), holes=[];
let rbSeq=0, rbTimer=null;
const PADDEG=0.000006;                                        // ~0.5 m: touching neighbours don't count as overlap
function bboxOf(r){ let a=[1e9,1e9,-1e9,-1e9]; for(const c of r){ if(c[0]<a[0])a[0]=c[0]; if(c[1]<a[1])a[1]=c[1]; if(c[0]>a[2])a[2]=c[0]; if(c[1]>a[3])a[3]=c[1]; } return a; }
function overlaps(a,b){ return a[0]<b[2]-PADDEG && a[2]>b[0]+PADDEG && a[1]<b[3]-PADDEG && a[3]>b[1]+PADDEG; }
function partsOf(g){ return !g?[]:g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[]; }
function addSurvivors(feats){
  let n=0;
  for(const f of feats){ const pr=f.properties||{};
    for(const pl of partsOf(f.geometry)){
      const bb=bboxOf(pl[0]);
      if(holes.some(h=>overlaps(bb,h))) continue;            // the smashed building (incl. its copies in neighbouring tiles)
      const key=bb.map(v=>v.toFixed(6)).join(',');
      if(rebuiltKeys.has(key)) continue; rebuiltKeys.add(key);
      rbSeq++; rebuilt.features.push({type:'Feature',id:rbSeq,geometry:{type:'Polygon',coordinates:pl},
        properties:{rid:rbSeq,h:+(pr.render_height??pr.height??6)||6,b:+(pr.render_min_height??pr.min_height??0)||0}});
      n++;
    } }
  return n;
}
function refreshRebuilt(){ const s=map.getSource('rebuilt'); if(s) s.setData(rebuilt); }
function collectSurvivors(){
  if(!destroyed.length) return;
  try{ const n=addSurvivors(map.querySourceFeatures(bSrc,{sourceLayer:'building',filter:['in',['id'],['literal',destroyed.slice()]]}));
    if(n) refreshRebuilt(); }catch(e){ console.warn('rebuild',e); }
}
function smashFeature(f,pt){
  const part=partsOf(f.geometry).find(pl=>inPoly(pt[0],pt[1],pl));
  if(part) holes.push(bboxOf(part[0]));
  if(f.layer && f.layer.id==='rebuilt-3d'){                  // hitting a redrawn building: just drop that one
    const rid=f.properties&&f.properties.rid;
    rebuilt.features=rebuilt.features.filter(x=>x.properties.rid!==rid); refreshRebuilt(); return;
  }
  destroyBuilding(f.id);
  collectSurvivors();
}
function destroyBuilding(id){
  // Features with no stable id can't be targeted by filter: skip hiding (the smash effect still plays).
  if(id==null||destroyed.includes(id)) return; destroyed.push(id);
  const f=['!',['in',['id'],['literal',destroyed.slice()]]];   // same id across tiles => split buildings vanish together
  for(const lid of hideIds){
    if(!map.getLayer(lid)) continue;
    const of=origFilters[lid], nf=of?['all',of,f]:f;
    try{ map.setFilter(lid,nf);
      if(of && JSON.stringify(map.getFilter(lid))!==JSON.stringify(nf)) map.setFilter(lid,f); // rejected: drop original
    }catch(e){ console.warn('destroyBuilding',e); }
  }
}
const seen={}; let nSeen=0;
map.on('error',e=>{ const m=((e&&e.error&&(e.error.message||e.error.status))||'unknown map error')+((e&&e.error&&e.error.stack)?'\n'+e.error.stack.split('\n').slice(0,4).join('\n'):''); const k=String(m).slice(0,60);
  console.warn('MAP:',m); if(seen[k]||nSeen>=6)return; seen[k]=1; nSeen++;
  let d=document.getElementById('maperr'); if(!d){d=document.createElement('pre'); d.id='maperr';
    d.style.cssText='position:fixed;left:8px;right:8px;top:70px;z-index:9998;background:#7c2d12;color:#fff;font:11px monospace;padding:8px;white-space:pre-wrap;border-radius:8px;max-height:30%;overflow:auto;pointer-events:none';
    document.body.appendChild(d);} d.textContent+='MAP: '+m+'\n'; });
map.on('load',()=>{ try{ initMini();
  try{ map.setSky({'sky-color':'#7ab8ea','horizon-color':'#eaf3fb','fog-color':'#eaf3fb','sky-horizon-blend':.6,'horizon-fog-blend':.7,'fog-ground-blend':.4}); }catch(e){}
  const layers = map.getStyle().layers;
  const src = layers.find(l=>l['source-layer']==='building')?.source || 'openmaptiles';
  if(!map.getLayer('building-3d') && map.getSource(src)){
    map.addLayer({id:'building-3d',source:src,'source-layer':'building',type:'fill-extrusion',minzoom:14,
      paint:{'fill-extrusion-color':'#d6dbe2','fill-extrusion-height':['coalesce',['get','render_height'],['get','height'],6],
      'fill-extrusion-base':['coalesce',['get','render_min_height'],['get','min_height'],0],'fill-extrusion-opacity':.95}});
  }
  const all = map.getStyle().layers;
  roadIds  = all.filter(l=>l['source-layer']==='transportation' && (l.type==='line'||l.type==='fill')).map(l=>l.id);
  bridgeIds= roadIds.filter(id=>!/tunnel|ferry|rail|aeroway/i.test(id));   // tunnels/ferry lines over water don't make it land
  waterIds = all.filter(l=>l['source-layer']==='water' && l.type==='fill').map(l=>l.id);
  blockIds = all.filter(l=>l['source-layer']==='building' && (l.type==='fill-extrusion')).map(l=>l.id);
  try{
    const fl=all.find(l=>l.layout&&l.layout['text-font']);
    const hs=(all.find(l=>l['source-layer']==='housenumber')||{}).source||src;
    if(map.getSource(hs) && !map.getLayer('hn-big')) map.addLayer({id:'hn-big',type:'symbol',source:hs,'source-layer':'housenumber',minzoom:15.5,
      layout:{'text-field':['to-string',['get','housenumber']],'text-font':fl?fl.layout['text-font']:['Noto Sans Regular'],
        'text-size':['interpolate',['linear'],['zoom'],15.5,10,19,18,21,26],'text-allow-overlap':false,'text-ignore-placement':false,'text-padding':6,
        'text-pitch-alignment':'viewport','text-rotation-alignment':'viewport'},
      paint:{'text-color':'#111827','text-halo-color':'rgba(255,255,255,.95)','text-halo-width':2}});
  }catch(e){ console.warn('house numbers:',e&&e.message); }
  houseIds = map.getStyle().layers.filter(l=>l.type==='symbol' && (l['source-layer']==='housenumber' || /housenum/i.test(l.id))).map(l=>l.id);
  houseIds.forEach(id=>{ try{ map.setLayoutProperty(id,'text-allow-overlap',false); map.setLayoutProperty(id,'text-ignore-placement',false); }catch(e){} });
  updateHouseFilter(true);
  hideIds = all.filter(l=>l['source-layer']==='building' && (l.type==='fill-extrusion'||l.type==='fill')).map(l=>l.id);
  hideIds.forEach(lid=>{ try{ const of=map.getFilter(lid); origFilters[lid]=of?toExpr(of):null; }catch(e){ origFilters[lid]=null; } });
  bSrc=src;
  try{
    const b3=blockIds[0], col=b3?map.getPaintProperty(b3,'fill-extrusion-color'):null, op=b3?map.getPaintProperty(b3,'fill-extrusion-opacity'):null;
    map.addSource('rebuilt',{type:'geojson',data:rebuilt});
    map.addLayer({id:'rebuilt-3d',type:'fill-extrusion',source:'rebuilt',
      paint:{'fill-extrusion-color':col||'hsl(35,8%,85%)','fill-extrusion-height':['get','h'],'fill-extrusion-base':['get','b'],
        'fill-extrusion-opacity':(typeof op==='number')?op:.8}}, map.getLayer('hn-big')?'hn-big':undefined);
    blockIds.push('rebuilt-3d');
    // tiles that stream in later may contain more of a hidden group: redraw those survivors too
    map.on('sourcedata',e=>{ if(e.sourceId!==bSrc||!e.tile||!destroyed.length) return;
      clearTimeout(rbTimer); rbTimer=setTimeout(collectSurvivors,300); });
  }catch(e){ console.warn('rebuilt layer',e); }
  // ---------- terrain, land cover / land use, trees, POI pins ----------
  const firstRoad=(all.find(l=>l['source-layer']==='transportation')||{}).id;
  const before=firstRoad&&map.getLayer(firstRoad)?firstRoad:undefined;
  try{
    const dem={type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
      encoding:'terrarium',tileSize:256,maxzoom:15,attribution:'Terrain: Mapzen / AWS Terrain Tiles'};
    map.addSource('dem',dem); map.addSource('dem-hs',Object.assign({},dem));
    map.addLayer({id:'hillshade',type:'hillshade',source:'dem-hs',
      paint:{'hillshade-exaggeration':.4,'hillshade-shadow-color':'#5a4f3f','hillshade-highlight-color':'#fffaf0'}},before);
    if(!POWER){ map.setTerrain({source:'dem',exaggeration:TERRAIN_X}); terrainOn=true; }
  }catch(e){ console.warn('terrain',e); }
  try{
    const TW=16, D=new Uint8Array(TW*TW*4);                      // crop-row stripes for farmland
    for(let y=0;y<TW;y++) for(let x=0;x<TW;x++){ const i=(y*TW+x)*4, g=(y%8)<4; D[i]=g?139:214; D[i+1]=g?163:190; D[i+2]=g?82:112; D[i+3]=255; }
    map.addImage('croprows',{width:TW,height:TW,data:D});
    map.addLayer({id:'lu-tint',type:'fill',source:bSrc,'source-layer':'landuse',
      paint:{'fill-color':['match',['get','class'],['commercial','retail'],'#f1c4c4','industrial','#d6cce6',['farmyard','farm'],'#e2cd96','residential','#ebe4d8','#e3e3e3'],'fill-opacity':.35}},before);
    map.addLayer({id:'lc-farm',type:'fill',source:bSrc,'source-layer':'landcover',filter:['==',['get','class'],'farmland'],
      paint:{'fill-pattern':'croprows','fill-opacity':.8}},before);

const debris=new THREE.Group(); scene.add(debris);
const dMats=[0xb45f4a,0x9a4a3a,0xc9c2b4,0x8b8f96,0x6b5b4b,0xd9d2c5].map(c=>new THREE.MeshPhongMaterial({color:c}));
const boxG=new THREE.BoxGeometry(1,1,1), dustG=new THREE.SphereGeometry(1,8,6);
const parts=[];
for(let i=0;i<90;i++){ const m=new THREE.Mesh(boxG,dMats[i%dMats.length]); m.visible=false; debris.add(m); parts.push({m,dust:false,life:0,max:1,vx:0,vy:0,vz:0,rx:0,ry:0,sz:.4}); }
for(let i=0;i<36;i++){ const m=new THREE.Mesh(dustG,new THREE.MeshBasicMaterial({color:0xd6cfc4,transparent:true,opacity:0,depthWrite:false})); m.visible=false; debris.add(m); parts.push({m,dust:true,life:0,max:1,vx:0,vy:0,vz:0,rx:0,ry:0,sz:1}); }
let shake=0, smashing=false, smashCool=0;
function spawn(nDeb,nDust,dir,col){
  let d=0,u=0;
  for(const q of parts){
    if(q.life>0) continue;
    if(!q.dust && d<nDeb){ d++; q.max=q.life=.9+Math.random()*.8; q.sz=.25+Math.random()*.6;
      q.m.position.set((Math.random()-.5)*2.2,.6+Math.random()*1.4,dir*(2.2+Math.random()*.8));
      q.vx=(Math.random()-.5)*16; q.vy=6+Math.random()*12; q.vz=dir*(4+Math.random()*12)*(Math.random()<.35?-1:1);
      q.rx=(Math.random()-.5)*14; q.ry=(Math.random()-.5)*14; q.m.scale.setScalar(q.sz); q.m.visible=true; }
    else if(q.dust && u<nDust){ u++; q.max=q.life=.8+Math.random()*.7;
      q.m.position.set((Math.random()-.5)*3,.8+Math.random()*1.2,dir*(2.4+Math.random()*1.2));
      q.vx=(Math.random()-.5)*5; q.vy=1.5+Math.random()*3; q.vz=dir*(1+Math.random()*3);
      q.sz=.9; q.m.material.color.setHex(col||0xd6cfc4); q.m.scale.setScalar(q.sz); q.m.material.opacity=.6; q.m.visible=true; }
    else continue;
    // debris lives in scene space, not car space: rotate spawn position/velocity into the car's yaw
    const ry=car.rotation.y, c=Math.cos(ry), s=Math.sin(ry), P=q.m.position, px=P.x, pz=P.z, vx=q.vx, vz=q.vz;
    P.x=px*c+pz*s; P.z=-px*s+pz*c; q.vx=vx*c+vz*s; q.vz=-vx*s+vz*c;
    if(d>=nDeb&&u>=nDust) break;
  }
}
function updateFx(dt,dm,carRotY){
  const k=dm/EXAG, sy=Math.sin(carRotY), cy=Math.cos(carRotY);       // world slides past as the car drives
  let live=0;
  for(const q of parts){
    if(q.life<=0) continue;
    q.life-=dt; if(q.life<=0){ q.m.visible=false; continue; }
    live++;
    const m=q.m;
    if(q.dust){ q.vy*=Math.exp(-dt*1.2); q.sz+=dt*3.2; m.scale.setScalar(q.sz); m.material.opacity=.6*(q.life/q.max); }
    else { q.vy-=32*dt; m.rotation.x+=q.rx*dt; m.rotation.y+=q.ry*dt;
      if(m.position.y<q.sz*.5&&q.vy<0){ m.position.y=q.sz*.5; q.vy*=-.35; q.vx*=.7; q.vz*=.7; } }
    m.position.x+=q.vx*dt+sy*k; m.position.y+=q.vy*dt; m.position.z+=q.vz*dt+cy*k;
  }
  if(shake>0){ shake=Math.max(0,shake-dt*2.2); const a=shake*9, tx=(Math.random()-.5)*a, ty=(Math.random()-.5)*a;
    mapEl.style.transform=cv.style.transform='translate('+tx+'px,'+ty+'px)'; }
  else if(shake===0 && updateFx.on){ mapEl.style.transform=cv.style.transform=''; updateFx.on=false; }
  if(shake>0) updateFx.on=true;
  return live;
}

let tSteer=0,tGas=0;
function joy(trackId,knobId,axis){
  const tr=document.getElementById(trackId),kb=document.getElementById(knobId),R=45; let pid=null;
  const upd=e=>{ if(e.pointerId!==pid)return; const r=tr.getBoundingClientRect();
    if(axis==='x'){tSteer=Math.max(-1,Math.min(1,(e.clientX-(r.left+r.width/2))/R)); kb.style.transform=`translateX(${tSteer*R}px)`;}

    S.hdg=(S.hdg+(9.81*Math.tan(G.bank)/G.air)*dt*180/Math.PI+360)%360;
    const dm=G.air*dt*GSPEED, h=rad(S.hdg);
    S.lat+=Math.cos(h)*dm/111320; S.lng+=Math.sin(h)*dm/(111320*Math.cos(rad(S.lat)));
    if(G.alt<=0){ G.alt=0; touchDown(); return; }
  }
  // camera: at the pilot's height, just behind and above, looking ahead and down
  const dB=((S.hdg-S.camB+540)%360)-180; S.camB+=dB*(1-Math.exp(-dt*2.5));
  const W=innerWidth,H=innerHeight,padTop=H*.34;
  if(W!==step.W||H!==step.H){ step.W=W; step.H=H;
    renderer.setSize(W,H,false); camera.aspect=W/H; camera.setViewOffset(W,H,0,-padTop/2,W,H);
    const dist=.5*H/Math.tan(rad(camera.fov)/2), p=rad(68);
    camera.position.set(0,dist*Math.cos(p),dist*Math.sin(p)); camera.lookAt(0,0,0); camera.updateProjectionMatrix(); placeGlider(); }
  const camAlt=Math.max(6,G.alt+14)*Math.pow(2,-zoomOff*.5), pr=rad(GP), hb=rad(S.camB), fwd=camAlt*Math.tan(pr);
  const cLat=S.lat+Math.cos(hb)*fwd/111320, cLng=S.lng+Math.sin(hb)*fwd/(111320*Math.cos(rad(S.lat)));
  const mppNeed=(camAlt/Math.cos(pr))/(.5*H/Math.tan(rad(36.87)/2));
  const z=Math.max(10,Math.min(21,Math.log2(78271.517*Math.cos(rad(S.lat))/mppNeed)));
  map.jumpTo({center:[cLng,cLat],bearing:S.camB,zoom:z,pitch:GP,padding:{top:padTop,bottom:0,left:0,right:0}});
  // glider attitude as seen from behind: level with the horizon, banked, nose follows the bar
  const bob=Math.sin(now/900)*.02;
  gMdl.rotation.set(rad(90-GP)-(G.phase==='fly'?gas*.12:0)+(G.phase==='land'?-.2:0)+bob, -rad(dB)*.6, -G.bank);
  updateFx(dt,0,0);
  renderer.render(scene,camera);
  // HUD + the usual background jobs
  if(every('ghud',.2)){
    const v=G.vs/GVERT;
    roadEl.textContent='Altitude '+Math.round(G.alt*3.281)+' ft'; roadEl.className='';
    surfEl.textContent='Hang glider · '+(v>=0?'▲ ':'▼ ')+Math.abs(v).toFixed(1)+' m/s'; surfEl.style.color=v>=0?'#86efac':'#fca5a5';
    nearEl.textContent=G.phase==='fly'&&G.lift>.8?'Thermal! Circle to climb':(G.phase==='fly'&&G.alt<60?'Getting low: find a thermal or triple-tap to land':nearestPoi());
    const mph=Math.round(G.air*2.237); if(mph!==step.mph){ step.mph=mph; mphEl.textContent=mph; }
  }
  if(every('place',1)) updatePlace(); if(every('house',.25)) updateHouseFilter(false);
  if(mini && every('mini',POWER?1:.12)){ try{ mini.jumpTo({center:[S.lng,S.lat]}); }catch(e){} }
  const ah=S.hdg.toFixed(1); if(ah!==step.ah && every('arrow',.05)){ step.ah=ah; miniArrowEl.style.transform='rotate('+ah+'deg)'; }
  if(every('clouds',2)) buildClouds(false);
  if(every('decor',.5) && styleReady && (!decorAt || meters(decorAt[1],decorAt[0],S.lat,S.lng)>250)) buildDecor();

const tick={};
function every(k,sec){ const t=last/1000; if(tick[k]===undefined||t-tick[k]>=sec){ tick[k]=t; return true; } return false; }
let lastStep=0;
function loop(now){
  if(POWER && now-lastStep<30){ requestAnimationFrame(loop); return; }   // ~30 fps in battery saver
  lastStep=now;
  try{ step(now); }catch(e){ if(!loop.err){loop.err=1; const d=document.createElement('pre'); d.style.cssText='position:fixed;left:8px;right:8px;top:8px;z-index:9999;background:#7f1d1d;color:#fff;font:12px monospace;padding:10px;white-space:pre-wrap;border-radius:8px'; d.textContent='LOOP ERROR: '+e.message+'\n'+(e.stack||'').split('\n').slice(0,4).join('\n'); document.body.appendChild(d);} }
  requestAnimationFrame(loop);

function step(now){
  const dt=Math.min((now-last)/1000,.05); last=now; frame++;

  const ease=(v,p,n)=>{ if(p)v+=dt*4; else if(n)v-=dt*4; else v*=Math.exp(-dt*8); return Math.max(-1,Math.min(1,v)); };
  kS=ease(kS,K.d||K.arrowright,K.a||K.arrowleft); kG=ease(kG,K.w||K.arrowup,K.s||K.arrowdown);
  const st=Math.abs(tSteer)>.05?tSteer:kS, gas=Math.abs(tGas)>.05?tGas:kG, hand=!!K[' '];
  if(mode==='glider'){ glideStep(dt,st,gas,now); return; }

  // longitudinal
  let a=0, braking=false;
  const tractor=(mode==='tractor'), pw=tractor?TRACTOR:1, vmax=MAXV*pw;
  if(gas>0.05) a=gas*(S.v<0?30:12)*pw*(1-Math.min(S.v/vmax,1)**2);
  else if(gas<-0.05){ if(S.v>.5){a=-28*(-gas);braking=true;} else a=gas*14*pw; }
  if(hand){a-=Math.sign(S.v)*30; braking=Math.abs(S.v)>.5;}
  const cap=boat?BOATMAX:tractor?vmax:(onRoad?MAXV:34);
  a-=Math.sign(S.v)*(boat?(.25+.0022*S.v*S.v):(.35+.0032*S.v*S.v));                // rolling + aero drag
  if(!onRoad&&!boat&&!tractor) a-=S.v*.15;                               // mild grass drag
  const prevV=S.v; S.v+=a*dt; if(prevV*S.v<0&&Math.abs(gas)<.05) S.v=0;
  if(S.v>cap) S.v=Math.max(cap,S.v-25*dt);                     // ease down to a lower cap instead of snapping
  S.v=Math.max(-REVMAX*pw,Math.min(MAXV,S.v)); if(Math.abs(S.v)<.05&&Math.abs(gas)<.05)S.v=0;

  // steering (bicycle model, less lock at speed)
  const lock=boat?rad(30)/(1+Math.abs(S.v)/12):rad(34)/(1+Math.abs(S.v)/7);
  S.steer+=(st*lock-S.steer)*Math.min(1,dt*9);
  S.hdg+=(S.v/(boat?7:WB))*Math.tan(S.steer)*dt*180/Math.PI;

  // move, with collision against buildings & water
  const dm=S.v*dt*SPEEDUP, h=rad(S.hdg);
  const nLat=S.lat+Math.cos(h)*dm/111320, nLng=S.lng+Math.sin(h)*dm/(111320*Math.cos(rad(S.lat)));
  let blocked=false, inBuilding=false;
  if(Math.abs(S.v)>.5 && styleReady && blockIds.length){
    const ahead=[nLng+Math.sin(h)*2.4/(111320*Math.cos(rad(S.lat)))*Math.sign(S.v), nLat+Math.cos(h)*2.4/111320*Math.sign(S.v)];
    const p=map.project(ahead);
    // tall extrusions overlap the car on screen, so candidates are filtered by real footprint under the car's nose.
    // A small box is enough: fill-extrusion queries hit the whole projected prism, including its base footprint.
    const bh=hit(p.x,p.y,6,blockIds).filter(f=>contains(f.geometry,ahead[0],ahead[1]));
    if(bh.length){ inBuilding=true;                                 // buildings stay standing; you just plow through
      const b0=bh[0], bid=b0.id!=null?b0.id:JSON.stringify(bboxOf(partsOf(b0.geometry)[0]?.[0]||[[0,0]]));

    else step.bid=null;
  }
  smashCool-=dt;
  if(inBuilding){
    const dir=S.v>=0?-1:1;
    if(!smashing||step.newHit){ step.newHit=false; spawn(34,14,dir); shake=1; smashCool=.05; }
    else if(smashCool<=0){ spawn(5,2,dir); smashCool=.06; shake=Math.max(shake,.35); }
    S.v*=Math.exp(-dt*1.6);                                    // buildings slow you, but you plow through
  }
  smashing=inBuilding;
  if(blocked){ S.v=-S.v*.3; } else { S.lat=nLat; S.lng=nLng; }

  // road detection
  if(every('place',1)) updatePlace(); if(every('house',.25)) updateHouseFilter(false);
  if(mini && every('mini',POWER?1:.12) && (!step.mLat || meters(step.mLat,step.mLng,S.lat,S.lng)>2)){
    step.mLat=S.lat; step.mLng=S.lng; try{ mini.jumpTo({center:[S.lng,S.lat]}); }catch(e){} }
  const ah=S.hdg.toFixed(1); if(ah!==step.ah && every('arrow',.05)){ step.ah=ah; miniArrowEl.style.transform='rotate('+ah+'deg)'; }
  const parked=Math.abs(S.v)<.05 && step.detOnce;
  if(!parked && styleReady && every('det',.12)){ step.detOnce=true;
    const p=map.project([S.lng,S.lat]); const f=hitRoad(p.x,p.y,48);
    const el=roadEl;
    if(f===null){ onRoad=true; el.textContent='Driving'; el.className=''; }      // road data unavailable: never punish
    else if(f.length>0){ miss=0; onRoad=true; const nm=f.find(x=>x.properties&&x.properties.name); roadName=nm?nm.properties.name:''; el.textContent=roadName||'On road'; el.className=''; }
    else if(++miss>=8){ onRoad=false; el.textContent='Off road'; el.className='off'; }   // ~1s of sustained misses
    // ---- which vehicle? Decided from the map's real water/farmland polygons (point-in-polygon on
    //      lng/lat), not from what happens to be drawn under a screen pixel, then debounced by time.
    if(!landCache.at || every('landcache',3) || meters(landCache.at[1],landCache.at[0],S.lat,S.lng)>400) rebuildLandCache();
    const water=inAny(landCache.water,S.lng,S.lat) && !hit(p.x,p.y,5,bridgeIds).length;
    const farm=!water && inAny(landCache.farm,S.lng,S.lat);
    const realRoad=farm && (hitRoad(p.x,p.y,4)||[]).some(f=>!/^(track|path)$/.test(String(f.properties&&f.properties.class||'')));
    const want=water?'boat':(farm&&!realRoad)?'tractor':'car';
    const tNow=last/1000, gap=Math.min(.5,tNow-(step.detT||tNow)); step.detT=tNow;
    if(want===mode){ candMode=null; candT=0; }
    else {
      if(want!==candMode){ candMode=want; candT=0; }
      candT+=gap;
      const need=want==='boat'?.25 : mode==='boat'?.4 : want==='tractor'?.5 : 1.0;   // seconds the new answer must hold
      if(candT>=need){ setMode(want); candMode=null; candT=0; }
    }
    if(boat){ onRoad=true; el.textContent='Boating'; el.className=''; }
    else {
      if(mode==='tractor'){ onRoad=true; el.textContent='In the field'; el.className=''; }
    }
    if(every('surf',.4)){
      const lt=boat?'Water':landHere(p);
      const txt=lt+(mode==='tractor'?' · Tractor':mode==='boat'?' · Bass boat':'');
      if(txt!==step.surf){ step.surf=txt; surfEl.textContent=txt; }
    }
  }
  if(every('towers',5) && !towerBusy && towerAt && meters(towerAt[1],towerAt[0],S.lat,S.lng)>15000) loadTowers();
  if(every('decor',.5)){
    if(styleReady && (!decorAt || meters(decorAt[1],decorAt[0],S.lat,S.lng)>250)) buildDecor();
    const nt=nearestPoi(); if(nt!==step.near){ step.near=nt; nearEl.textContent=nt; }
  }
  // terrain slope under the vehicle (tilts it up and down hills)
  if(!terrainOn){ S.sp*=.9; S.sr*=.9; }
  else if(!parked && every('slope',.05)){
    try{
      const d=3, c=Math.cos(h), s=Math.sin(h), kx=1/(111320*Math.cos(rad(S.lat))), ky=1/111320;
      const e=(dx,dy)=>map.queryTerrainElevation([S.lng+dx*kx,S.lat+dy*ky]);
      const eF=e(s*d,c*d), eB=e(-s*d,-c*d), eR=e(c*d,-s*d), eL=e(-c*d,s*d);
      if(eF!=null&&eB!=null&&eR!=null&&eL!=null){
        const cl=v=>Math.max(-.35,Math.min(.35,v));
        const tp=cl(Math.atan2(eF-eB,2*d)), tr=cl(Math.atan2(eR-eL,2*d));

    }catch(e){}
  }

  const dB=((S.hdg-S.camB+540)%360)-180; S.camB+=dB*(1-Math.exp(-dt*7));
  const tz=19.3+zoomOff-Math.min(Math.abs(S.v)/MAXV,1)*2.0; S.zoom+=(tz-S.zoom)*Math.min(1,dt*3);
  const W=innerWidth,H=innerHeight,padTop=H*.34;
  const cm0=step.cam||{};
  const camMoved=dirty||W!==cm0.W||H!==cm0.H||Math.abs(S.lng-cm0.lng)>1e-8||Math.abs(S.lat-cm0.lat)>1e-8||Math.abs(S.camB-cm0.b)>.005||Math.abs(S.zoom-cm0.z)>.0003;
  if(camMoved){ step.cam={lng:S.lng,lat:S.lat,b:S.camB,z:S.zoom,W,H};
    map.jumpTo({center:[S.lng,S.lat],bearing:S.camB,zoom:S.zoom,pitch:68,padding:{top:padTop,bottom:0,left:0,right:0}}); }

  if(W!==step.W||H!==step.H){ step.W=W; step.H=H;               // only touch the GL canvas / camera on resize
    renderer.setSize(W,H,false); camera.aspect=W/H;
    camera.setViewOffset(W,H,0,-padTop/2,W,H);
    const fovR=rad(camera.fov), dist=.5*H/Math.tan(fovR/2), p=rad(68);
    camera.position.set(0,dist*Math.cos(p),dist*Math.sin(p)); camera.lookAt(0,0,0); camera.updateProjectionMatrix(); placeGlider(); }
  const sc=EXAG/mpp(S.lat,S.zoom); car.scale.setScalar(sc); debris.scale.setScalar(sc);
  car.rotation.y=-rad(S.hdg-S.camB);
  const tRoll=S.steer*Math.min(Math.abs(S.v)/12,1.2)*.35, tPitch=Math.max(-.05,Math.min(.05,a*.004));
  S.roll+=(tRoll-S.roll)*Math.min(1,dt*6); S.pitch+=(tPitch-S.pitch)*Math.min(1,dt*6);
  body.rotation.z=S.roll+S.sr; body.rotation.x=S.pitch+S.sp;
  tractorG.rotation.z=S.roll*.6+S.sr; tractorG.rotation.x=S.pitch*.6+S.sp;
  if(boat){ boatG.rotation.z=S.roll*1.6+Math.sin(now/420)*.03; boatG.rotation.x=S.pitch+Math.sin(now/510)*.025; boatG.position.y=-.1+Math.sin(now/360)*.05;
    if(Math.abs(S.v)>3 && every('wake',.035)) spawn(0,Math.min(3,1+Math.floor(Math.abs(S.v)/15)),1,0xf4fbff); }

  if(mode==='car') wheels.forEach(w=>{ w.spin.rotation.x=-S.dist/.38; if(w.front) w.pivot.rotation.y=-S.steer; });
  else if(mode==='tractor'){

  }

  const live=updateFx(dt,dm,car.rotation.y);
  const settling=Math.abs(tRoll-S.roll)>1e-3||Math.abs(tPitch-S.pitch)>1e-3||Math.abs(S.steer-(step.pst||0))>1e-4||braking!==step.pbr||Math.abs(S.sp)>1e-3&&!terrainOn;
  step.pst=S.steer; step.pbr=braking;
  const bob=boat&&(!POWER||frame%2===0);                         // parked boat still bobs, at half rate in saver
  if(camMoved||settling||live>0||shake>0||bob){ renderer.render(scene,camera); }
  dirty=false;

  const mph=Math.round(Math.abs(S.v)*2.237); if(mph!==step.mph){ step.mph=mph; mphEl.textContent=mph; }
}

<script>
/* ================= ENHANCEMENTS: roads, signs, navigation, day/night, weather =================
   Optional polish on top of the game. Everything runs inside this IIFE (so no name clashes with the
   game script) and every part is wrapped, so a failed data source or style change leaves the game running. */
(()=>{
'use strict';
const ENH={};
const EMPTY={type:'FeatureCollection',features:[]};
const PXM=1/mpp(START.lat,20);                                   // screen px per metre at zoom 20
// width/offset in real metres -> zoom-scaled pixels (optional minimum pixel size)
function mz(m,min){ min=min||0; const f=v=>Math.sign(m)*Math.max(min,Math.abs(v)); return ['interpolate',['exponential',2],['zoom'],14,f(m*PXM/64),22,f(m*PXM*4)]; }
function mzE(e){ return ['interpolate',['exponential',2],['zoom'],14,['*',e,PXM/64],22,['*',e,PXM*4]]; }
function safe(name,fn){ try{ return fn(); }catch(e){ console.warn('['+name+']',e&&e.message||e); } }
const UNDER='building';                                          // our ground layers sit just below the buildings
function addUnder(l){ if(!map.getLayer(l.id)) map.addLayer(l,map.getLayer(UNDER)?UNDER:undefined); }
function srcName(){ return (typeof bSrc==='string'&&map.getSource(bSrc))?bSrc:'openmaptiles'; }
function img(w,h,draw){ const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); draw(x,w,h); return x.getImageData(0,0,w,h); }
function addImg(id,data,opt){ if(!map.hasImage(id)) map.addImage(id,data,opt||{}); }
const inits=[], ticks=[];
function onReady(fn){ inits.push(fn); }
function onTick(ms,fn){ ticks.push({ms,fn,t:0}); }

/* ---------- 1. ROAD MARKINGS, BRIDGES, RIVERS ---------- */
onReady(function roadsAndWater(){
  const src=srcName(), all=map.getStyle().layers, ids=all.map(l=>l.id);
  const after=id=>{ const i=ids.indexOf(id); return i>=0&&i+1<ids.length?ids[i+1]:undefined; };
  // water: deeper blue, visible creeks, a light shoreline
  const RIV='#3b8de0';
  safe('water',()=>{ if(map.getLayer('water')) map.setPaintProperty('water','fill-color','#69acec'); });
  safe('rivers',()=>{ if(map.getLayer('waterway_river')){ map.setPaintProperty('waterway_river','line-color',RIV); map.setPaintProperty('waterway_river','line-width',mz(14,1.5)); } });
  safe('creeks',()=>{ if(map.getLayer('waterway_other')){ map.setPaintProperty('waterway_other','line-color',RIV);
    map.setPaintProperty('waterway_other','line-width',mzE(['match',['get','class'],'canal',8,'stream',3.5,['ditch','drain'],1.5,2.5])); } });
  safe('shore',()=>{ if(map.getLayer('water')&&!map.getLayer('water-shore')) map.addLayer({id:'water-shore',type:'line',source:src,'source-layer':'water',
    paint:{'line-color':'#e0f2fe','line-opacity':.85,'line-width':['interpolate',['linear'],['zoom'],12,.5,18,2.5]}},after('water')); });

  // lane and centre lines (US style): double yellow on two-way major roads, dashed yellow on two-way
  // collectors, dashed white lane lines on one-way carriageways. Residential streets stay unmarked, like the real ones.
  safe('markings',()=>{
    const oneway=['coalesce',['get','oneway'],0], two=['==',oneway,0], one=['!=',oneway,0];
    const base=['all',['==',['geometry-type'],'LineString'],['!=',['coalesce',['get','brunnel'],''],'tunnel'],['!=',['coalesce',['get','ramp'],0],1]];
    const cls=l=>['match',['get','class'],l,true,false];
    const L=(id,filter,paint)=>addUnder({id,type:'line',source:src,'source-layer':'transportation',minzoom:15,filter:base.concat([filter[0],filter[1]]),
      layout:{'line-cap':'butt','line-join':'round'},paint:Object.assign({'line-width':mz(.16,.8)},paint)});
    const Y='#f2c230', W='#f8fafc', DASH=[20,60];                 // 3 m dash, 9 m gap at 0.16 m line width
    L('mk-dy-l',[two,cls(['trunk','primary','secondary'])],{'line-color':Y,'line-offset':mz(-.22)});
    L('mk-dy-r',[two,cls(['trunk','primary','secondary'])],{'line-color':Y,'line-offset':mz(.22)});
    L('mk-cy',[two,cls(['tertiary'])],{'line-color':Y,'line-dasharray':DASH});
    L('mk-lane',[one,cls(['motorway','trunk','primary','secondary'])],{'line-color':W,'line-dasharray':DASH});
  });

  // bridges: a soft shadow around the deck and a railing along each edge, sized from the style's own deck width
  safe('bridges',()=>{
    const firstBridge=(all.find(l=>/^bridge_/.test(l.id))||{}).id;
    all.filter(l=>/^bridge_.*_casing$/.test(l.id)&&!/path_pedestrian/.test(l.id)&&l.type==='line'&&l.paint&&l.paint['line-width']).forEach(l=>{
      const c={type:'line',source:l.source,'source-layer':l['source-layer'],minzoom:Math.max(l.minzoom||0,13)};
      if(l.filter) c.filter=l.filter; if(l.maxzoom) c.maxzoom=l.maxzoom;
      if(!map.getLayer(l.id+'-shadow')) map.addLayer(Object.assign({},c,{id:l.id+'-shadow',
        paint:{'line-color':'#0f172a','line-opacity':.35,'line-gap-width':l.paint['line-width'],'line-width':mz(3,2),'line-blur':mz(3,2)}}),firstBridge);
      addUnder(Object.assign({},c,{id:l.id+'-rail',layout:{'line-cap':'butt','line-join':'round'},
        paint:{'line-color':'#475569','line-gap-width':l.paint['line-width'],'line-width':mz(.45,1.2)}}));
    });
  });
});

/* ---------- shared geometry helpers (local metres: x = lng*MLNG, y = lat*MLAT) ---------- */
function psd(px,py,ax,ay,bx,by){ const dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy; let t=L?((px-ax)*dx+(py-ay)*dy)/L:0; t=t<0?0:t>1?1:t; return [Math.hypot(px-ax-t*dx,py-ay-t*dy),t]; }
function polyDist(pts,x,y){ let b=1e18; for(let i=1;i<pts.length;i++){ const d=psd(x,y,pts[i-1][0],pts[i-1][1],pts[i][0],pts[i][1])[0]; if(d<b) b=d; } return b; }
// crossing point of two segments [ax,ay,bx,by,...], allowing ~2 m of slack at the ends (T-junctions); ignores near-parallel pairs
function segX(s,t){ const x1=s[0],y1=s[1],x2=s[2],y2=s[3],x3=t[0],y3=t[1],x4=t[2],y4=t[3];
  const L1=Math.hypot(x2-x1,y2-y1)||1, L2=Math.hypot(x4-x3,y4-y3)||1, d=(x2-x1)*(y4-y3)-(y2-y1)*(x4-x3);
  if(Math.abs(d)/(L1*L2)<.42) return null;                       // under ~25 degrees: a name change, not a crossing

/* ---------- 2. STREET SIGNS, STOP SIGNS, TRAFFIC LIGHTS, RAIL CROSSINGS, SPEED LIMITS ---------- */
// OpenStreetMap data via Overpass (same servers as the water towers), refreshed as you drive
const OX={at:null,busy:false,failT:0,stops:[],sigs:[],xings:[],speeds:[]};

async function loadExtras(){
  if(OX.busy) return; OX.busy=true;
  const cx=S.lng, cy=S.lat, dy=.02, dx=.027;                     // ~4.4 km square around the car
  const bb=`(${(cy-dy).toFixed(4)},${(cx-dx).toFixed(4)},${(cy+dy).toFixed(4)},${(cx+dx).toFixed(4)})`;
  const q=`[out:json][timeout:25];(node["highway"~"^(stop|traffic_signals)$"]${bb};node["railway"="level_crossing"]${bb};way["highway"]["maxspeed"]${bb};);out geom qt;`;
  let j=null;
  try{
    for(const url of OVERPASS){ try{ const r=await fetch(url,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'}});
      if(r.ok){ j=await r.json(); break; } }catch(e){} }
    if(!j){ OX.failT=Date.now(); OX.at=[cx,cy]; return; }
    const stops=[],sigs=[],xings=[],speeds=[], seen=new Set();
    for(const el of j.elements||[]){ const t=el.tags||{};
      if(el.type==='node'&&el.lat!=null){ const o={id:el.id,x:el.lon*MLNG,y:el.lat*MLAT};
        const k=t.highway==='stop'?'s':t.highway==='traffic_signals'?'g':t.railway==='level_crossing'?'x':''; if(!k) continue;
        const key=k+Math.round(o.x/12)+','+Math.round(o.y/12); if(seen.has(key)) continue; seen.add(key);   // one per ~12 m

        speeds.push({mph,name:t.name||'',pts,bb:bboxOf(pts)}); } }
    Object.assign(OX,{stops,sigs,xings,speeds,at:[cx,cy],failT:0}); ENH.signsDirty=true;
  }catch(e){ console.warn('osm extras',e); OX.failT=Date.now(); OX.at=[cx,cy]; }
  finally{ OX.busy=false; }
}
onTick(2000,function extrasTick(){

// street-name blades at intersections, found from where differently named roads cross in the map's own data
let blades=[], bladeAt=null;
function computeBlades(){
  const cx=S.lng*MLNG, cy=S.lat*MLAT, R=420, segs=[];
  let feats=[]; try{ feats=map.querySourceFeatures(srcName(),{sourceLayer:'transportation_name'}); }catch(e){}
  for(const f of feats){ const p=f.properties||{}, nm=p.name||p['name:latin']||p.ref; if(!nm) continue;
    if(/^(path|track|service|footway|cycleway|pedestrian|bridleway|steps|rail|transit)$/.test(p.class||'')) continue;
    const g=f.geometry, lines=!g?[]:g.type==='LineString'?[g.coordinates]:g.type==='MultiLineString'?g.coordinates:[];
    for(const ln of lines) for(let i=1;i<ln.length;i++){
      const ax=ln[i-1][0]*MLNG, ay=ln[i-1][1]*MLAT, bx=ln[i][0]*MLNG, by=ln[i][1]*MLAT;
      if(Math.max(ax,bx)<cx-R||Math.min(ax,bx)>cx+R||Math.max(ay,by)<cy-R||Math.min(ay,by)>cy+R) continue;
      segs.push([ax,ay,bx,by,nm]); }
    if(segs.length>8000) break; }
  const C=50, grid=new Map();
  segs.forEach((s,k)=>{ for(let i=Math.floor(Math.min(s[0],s[2])/C);i<=Math.floor(Math.max(s[0],s[2])/C);i++)
    for(let j=Math.floor(Math.min(s[1],s[3])/C);j<=Math.floor(Math.max(s[1],s[3])/C);j++){ const kk=i+','+j; let a=grid.get(kk); if(!a) grid.set(kk,a=[]); a.push(k); } });
  const out=[];
  for(const list of grid.values()) for(let a=0;a<list.length;a++) for(let b=a+1;b<list.length;b++){
    const s=segs[list[a]], t=segs[list[b]]; if(s[4]===t[4]) continue;
    const p=segX(s,t); if(!p) continue;
    const names=[s[4],t[4]].sort(), key=names.join('|');
    if(out.some(o=>o.key===key&&Math.hypot(o.x-p[0],o.y-p[1])<40)) continue;
    out.push({key,x:p[0],y:p[1],names}); }
  out.sort((a,b)=>Math.hypot(a.x-cx,a.y-cy)-Math.hypot(b.x-cx,b.y-cy));
  blades=out.slice(0,50); bladeAt=[S.lng,S.lat]; ENH.signsDirty=true;
}
// drop signs a few metres off to a corner so they stand beside the road, not in it
function buildSigns(){
  const src=map.getSource('enh-signs'); if(!src) return;
  const cx=S.lng*MLNG, cy=S.lat*MLAT, R=450, F=[], near=o=>Math.hypot(o.x-cx,o.y-cy)<R;
  const pt=(x,y,props)=>F.push({type:'Feature',properties:props,geometry:{type:'Point',coordinates:[x/MLNG,y/MLAT]}});
  for(const o of OX.stops) if(near(o)) pt(o.x+3,o.y-3,{k:'stop'});
  for(const o of OX.sigs) if(near(o)) pt(o.x-6,o.y-6,{k:'sig',ph:hash(Math.round(o.x/60),Math.round(o.y/60))<.5?0:1});
  for(const o of OX.xings) if(near(o)) pt(o.x+4,o.y+4,{k:'xing'});
  for(const b of blades) if(near(b)){ pt(b.x+5,b.y+5,{k:'post'}); pt(b.x+5,b.y+5,{k:'blade',name:b.names.map(abbr).join('\n')}); }

// sign artwork, drawn once (128 px of image ~ 3.2 m, a little oversized for readability)
function post(x,w,h,top){ x.fillStyle='#8b949e'; x.fillRect(w/2-2,top,4,h-top); x.fillStyle='#5f6771'; x.fillRect(w/2+1,top,1,h-top); }

    [['r',17,'#ef4444'],['y',38,'#fbbf24'],['g',59,'#22c55e']].forEach(([k,y,c])=>{ x.beginPath(); x.arc(24,y,8,0,7);
      if(k===on){ x.shadowColor=c; x.shadowBlur=12; x.fillStyle=c; } else { x.shadowBlur=0; x.fillStyle='#3b4452'; } x.fill(); x.shadowBlur=0; }); }));

// rail crossings: a bump as you cross (checked along the path travelled, so it can't be skipped at speed) and a heads-up
onTick(100,function xingTick(){

// speed limit for the road under the car (posted limit from OSM, else a default for that kind of road)

/* ---------- 3. TAP-TO-ROUTE NAVIGATION + BREADCRUMB TRAIL ---------- */

  if(m.startsWith('slight')) return 'Bear '+side+onto; if(m.startsWith('sharp')) return 'Sharp '+side+onto;

function setBanner(a,d,t){ if(navArrowEl.textContent!==a) navArrowEl.textContent=a; if(navDistEl.textContent!==d) navDistEl.textContent=d; if(navStreetEl.textContent!==t) navStreetEl.textContent=t; }
function setLine(id,coords){ const s=map.getSource(id); if(s) s.setData(coords&&coords.length>1?{type:'Feature',properties:{},geometry:{type:'LineString',coordinates:coords}}:EMPTY);
  const m=ENH.miniOk&&mini.getSource(id); if(m) m.setData(coords&&coords.length>1?{type:'Feature',properties:{},geometry:{type:'LineString',coordinates:coords}}:EMPTY); }
function setDest(p){ const d=p?{type:'Feature',properties:{},geometry:{type:'Point',coordinates:p}}:EMPTY;
  const s=map.getSource('nav-dest'); if(s) s.setData(d); const m=ENH.miniOk&&mini.getSource('nav-dest'); if(m) m.setData(d); }

function setRoute(rt){

  if(NAV.drawAt==null||Math.abs(along-NAV.drawAt)>15){           // only draw what's still ahead
    NAV.drawAt=along; const c=NAV.coords, a=c[bi], b=c[bi+1];
    setLine('nav-route',[[a[0]+(b[0]-a[0])*bt,a[1]+(b[1]-a[1])*bt]].concat(c.slice(bi+1))); }
}
onTick(200,navTick);
document.getElementById('navX').addEventListener('click',e=>{ e.stopPropagation(); clearRoute(); toast('Route cleared',1400); });
mapEl.addEventListener('click',e=>{
  if(mode==='glider'||!ENH.booted) return;
  const r=mapEl.getBoundingClientRect(); let ll=null;
  try{ ll=map.unproject([e.clientX-r.left,e.clientY-r.top]); }catch(_){}
  if(!ll||!isFinite(ll.lng)||!isFinite(ll.lat)||meters(S.lat,S.lng,ll.lat,ll.lng)>40000){ toast('Tap a spot on the ground to route there',1800); return; }
  NAV.dest=[ll.lng,ll.lat]; setDest(NAV.dest); requestRoute(false);
});

// breadcrumb trail of where you've driven (kept between visits on this device)
const TRAIL={segs:[[]],n:0,changed:false,saved:0};
try{ const t=JSON.parse(localStorage.getItem('ydTrail')||'null'); if(Array.isArray(t)){ TRAIL.segs=t.filter(s=>Array.isArray(s)&&s.length>1); TRAIL.segs.push([]); TRAIL.n=TRAIL.segs.reduce((a,s)=>a+s.length,0); } }catch(e){}
function trailData(){ const lines=TRAIL.segs.filter(s=>s.length>1); return lines.length?{type:'Feature',properties:{},geometry:{type:'MultiLineString',coordinates:lines}}:EMPTY; }
onTick(500,function trailTick(){
  const cur=TRAIL.segs[TRAIL.segs.length-1], last=cur[cur.length-1], p=[+S.lng.toFixed(6),+S.lat.toFixed(6)];
  const d=last?meters(last[1],last[0],p[1],p[0]):1e9;
  if(last&&d<8) return;
  if(last&&d>400){ TRAIL.segs.push([p]); } else cur.push(p);     // a jump starts a new line instead of drawing across the map
  TRAIL.n++; TRAIL.changed=true;
  while(TRAIL.n>5000&&TRAIL.segs.length){ const s=TRAIL.segs[0]; s.shift(); TRAIL.n--; if(s.length<2&&TRAIL.segs.length>1){ TRAIL.n-=s.length; TRAIL.segs.shift(); } }
});
onTick(1000,function trailDraw(){
  if(!TRAIL.changed) return; TRAIL.changed=false; const d=trailData();
  const s=map.getSource('trail'); if(s) s.setData(d); const m=ENH.miniOk&&mini.getSource('trail'); if(m) m.setData(d);
  if(Date.now()-TRAIL.saved>15000){ TRAIL.saved=Date.now(); try{ localStorage.setItem('ydTrail',JSON.stringify(TRAIL.segs.filter(s=>s.length>1))); }catch(e){} }
});
onReady(function navLayers(){
  addImg('sg-chev',img(32,32,(x)=>{ x.strokeStyle='#fff'; x.lineWidth=5; x.lineCap='round'; x.lineJoin='round'; x.beginPath(); x.moveTo(10,7); x.lineTo(22,16); x.lineTo(10,25); x.stroke(); }));
  addImg('sg-flag',img(64,128,(x,w,h)=>{ post(x,w,h,6); for(let r=0;r<4;r++) for(let c=0;c<6;c++){ x.fillStyle=(r+c)%2?'#111':'#fff'; x.fillRect(34+c*4.5,6+r*6,4.5,6); }
    x.strokeStyle='#111'; x.lineWidth=1; x.strokeRect(34,6,27,24); }));
  map.addSource('trail',{type:'geojson',data:trailData()});
  map.addSource('nav-route',{type:'geojson',data:EMPTY});
  map.addSource('nav-dest',{type:'geojson',data:EMPTY});
  addUnder({id:'trail-line',type:'line',source:'trail',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#c084fc','line-opacity':.55,'line-width':mz(1.2,1.5)}});
  addUnder({id:'nav-casing',type:'line',source:'nav-route',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#1e3a8a','line-opacity':.85,'line-width':mz(4.2,6)}});
  addUnder({id:'nav-line',type:'line',source:'nav-route',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#3b82f6','line-width':mz(3,4)}});
  addUnder({id:'nav-chev',type:'symbol',source:'nav-route',layout:{'symbol-placement':'line','symbol-spacing':70,'icon-image':'sg-chev',
    'icon-size':['interpolate',['linear'],['zoom'],14,.35,19,.6,22,1.1],'icon-allow-overlap':true,'icon-ignore-placement':true,'icon-rotation-alignment':'map','icon-pitch-alignment':'map'}});
  map.addLayer({id:'nav-flag',type:'symbol',source:'nav-dest',layout:Object.assign({'icon-image':'sg-flag','icon-size':ISZ},BILL)});
  setTimeout(()=>{ try{ if(!localStorage.getItem('ydNavTip')){ localStorage.setItem('ydNavTip','1'); toast('Tip: tap anywhere on the map to get directions there',4500); } }catch(e){} },9000);
});
// same route, destination and trail on the round minimap
onTick(1000,function miniNav(){
  if(ENH.miniOk||!mini||!miniReady) return;
  try{ if(!mini.isStyleLoaded()) return;
    mini.addSource('trail',{type:'geojson',data:trailData()}); mini.addSource('nav-route',{type:'geojson',data:EMPTY}); mini.addSource('nav-dest',{type:'geojson',data:EMPTY});
    mini.addLayer({id:'trail-line',type:'line',source:'trail',paint:{'line-color':'#a855f7','line-opacity':.6,'line-width':2}});
    mini.addLayer({id:'nav-line',type:'line',source:'nav-route',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#2563eb','line-width':4}});
    mini.addLayer({id:'nav-dest',type:'circle',source:'nav-dest',paint:{'circle-radius':5,'circle-color':'#111','circle-stroke-color':'#fff','circle-stroke-width':2}});
    ENH.miniOk=true; if(NAV.coords) setLine('nav-route',NAV.coords.slice(NAV.idx)); if(NAV.dest) setDest(NAV.coords?NAV.coords[NAV.coords.length-1]:NAV.dest);
  }catch(e){ console.warn('mini nav',e); ENH.miniOk=true; }
});

/* ---------- 4. REAL TIME OF DAY + LIVE WEATHER ----------
   The sun's real position over the car sets how dark the map is, the sky, which way buildings are lit,
   lit windows after dark and the SUV's headlights. Current conditions from Open-Meteo (free, no key) add
   rain, snow, fog, cloud dimming and lightning. For testing, ?hour=21.5 fixes the clock and ?wx=63 fixes
   the weather (WMO code). */
const QS=(()=>{ try{ return new URLSearchParams(location.search); }catch(e){ return {get:()=>null}; } })();
const FIX_HOUR=QS.get('hour')!=null&&isFinite(+QS.get('hour'))?+QS.get('hour'):null, FIX_WX=QS.get('wx')!=null&&isFinite(+QS.get('wx'))?+QS.get('wx'):null;
function nowDate(){ if(FIX_HOUR==null) return new Date(); const d=new Date(); d.setHours(0,0,0,0); return new Date(d.getTime()+FIX_HOUR*3600000); }
// solar altitude/azimuth in degrees (azimuth clockwise from north); accurate to well under a degree
function sunPos(date,lat,lng){
  const R=Math.PI/180, d=date.getTime()/86400000-10957.5;
  const g=(357.529+.98560028*d)*R, q=280.459+.98564736*d, L=(q+1.915*Math.sin(g)+.020*Math.sin(2*g))*R, e=(23.439-.00000036*d)*R;
  const ra=Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L)), dec=Math.asin(Math.sin(e)*Math.sin(L));
  const gmst=(18.697374558+24.06570982441908*d)%24, H=(gmst*15+lng)*R-ra, la=lat*R;
  const alt=Math.asin(Math.sin(la)*Math.sin(dec)+Math.cos(la)*Math.cos(dec)*Math.cos(H));
  const az=Math.atan2(-Math.sin(H),Math.tan(dec)*Math.cos(la)-Math.sin(la)*Math.cos(H));
  return {alt:alt/R,az:((az/R)+360)%360};
}
// WMO weather code -> what to draw
function wxFrom(code){
  const c=+code, W={code:c,type:null,int:0,fog:0,thunder:false,icon:'☀️',text:'Clear'};
  if(c===1){ W.icon='🌤️'; W.text='Mostly clear'; } else if(c===2){ W.icon='⛅'; W.text='Partly cloudy'; } else if(c===3){ W.icon='☁️'; W.text='Overcast'; }
  else if(c===45||c===48){ W.icon='🌫️'; W.text=c===48?'Freezing fog':'Fog'; W.fog=.85; }
  else if(c>=51&&c<=57){ W.icon='🌦️'; W.text=c>=56?'Freezing drizzle':'Drizzle'; W.type='rain'; W.int=c===51||c===56?.2:c===53?.3:.4; }
  else if(c>=61&&c<=67){ W.icon='🌧️'; W.text=(c>=66?'Freezing rain':c===61?'Light rain':c===63?'Rain':'Heavy rain'); W.type='rain'; W.int=c===61||c===66?.4:c===63?.7:1; }
  else if(c>=71&&c<=77){ W.icon='🌨️'; W.text=c===77?'Snow grains':c===71?'Light snow':c===73?'Snow':'Heavy snow'; W.type='snow'; W.int=c===71||c===77?.35:c===73?.65:1; }
  else if(c>=80&&c<=82){ W.icon='🌧️'; W.text=c===80?'Rain showers':'Heavy showers'; W.type='rain'; W.int=c===80?.5:c===81?.8:1; }
  else if(c===85||c===86){ W.icon='🌨️'; W.text='Snow showers'; W.type='snow'; W.int=c===85?.5:.9; }
  else if(c>=95){ W.icon='⛈️'; W.text='Thunderstorm'; W.type='rain'; W.int=.9; W.thunder=true; }
  return W;
}
const AT={wx:wxFrom(FIX_WX!=null?FIX_WX:0), cloud:FIX_WX!=null?(FIX_WX>=3?1:FIX_WX===2?.5:0):0, temp:null, tzOff:null, wxAt:null, wxT:0, wxBusy:false,
  k:-1, windows:false, beams:null, lastKey:''};
const wxlEl=document.getElementById('wxl'), fogEl=document.getElementById('fog'), flashEl=document.getElementById('flash'), wxCv=document.getElementById('wx');
async function loadWeather(){
  if(AT.wxBusy||FIX_WX!=null) return; AT.wxBusy=true; AT.wxT=Date.now();
  const lat=S.lat, lng=S.lng, ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),8000);
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(3)}&longitude=${lng.toFixed(3)}&current=temperature_2m,weather_code,cloud_cover,visibility&temperature_unit=fahrenheit&timezone=auto`,{signal:ctl.signal});
    if(!r.ok) throw new Error('weather '+r.status);
    const j=await r.json(), c=j.current||{};
    AT.wx=wxFrom(c.weather_code||0); AT.cloud=Math.max(0,Math.min(1,(c.cloud_cover??0)/100));
    if(c.visibility!=null&&c.visibility<3000) AT.wx.fog=Math.max(AT.wx.fog,Math.min(.9,(3000-c.visibility)/2500));
    AT.temp=c.temperature_2m!=null?Math.round(c.temperature_2m):null; AT.tzOff=j.utc_offset_seconds!=null?j.utc_offset_seconds:null;
    AT.wxAt=[lng,lat]; AT.lastKey=''; applyAtmos(); startWx();
  }catch(e){ console.warn('weather',e&&e.message||e); AT.wxAt=[lng,lat]; }
  finally{ clearTimeout(to); AT.wxBusy=false; }
}
onTick(5000,function weatherTick(){
  const moved=AT.wxAt?meters(AT.wxAt[1],AT.wxAt[0],S.lat,S.lng):1e9;
  if(moved>15000||Date.now()-AT.wxT>15*60000) loadWeather();
});
// local clock at the car (Open-Meteo gives the place's UTC offset; the device clock otherwise)
function clock(){
  const d=nowDate(); let h,m;
  if(AT.tzOff!=null&&FIX_HOUR==null){ const t=new Date(d.getTime()+AT.tzOff*1000); h=t.getUTCHours(); m=t.getUTCMinutes(); } else { h=d.getHours(); m=d.getMinutes(); }
  return (h%12||12)+':'+String(m).padStart(2,'0')+(h<12?' AM':' PM');
}
function hudLine(){
  if(!wxlEl) return; const W=AT.wx, known=FIX_WX!=null||AT.temp!=null;
  const t=(known?W.icon+' '+(AT.temp!=null?AT.temp+'°F · ':'')+W.text+' · ':(AT.k>.5?'🌙 ':'')) + clock();
  if(wxlEl.textContent!==t) wxlEl.textContent=t;
}
// colours
const mix=(a,b,t)=>{ const A=parseInt(a.slice(1),16), B=parseInt(b.slice(1),16), f=(s)=>Math.round(((A>>s)&255)+(((B>>s)&255)-((A>>s)&255))*t);
  return '#'+((1<<24)|(f(16)<<16)|(f(8)<<8)|f(0)).toString(16).slice(1); };
const clamp01=v=>v<0?0:v>1?1:v;
// lit-window pattern for buildings after dark (dark walls, some warm windows)
function windowImage(){
  addImg('enh-win',img(64,64,(x,w,h)=>{ x.fillStyle='#262c3a'; x.fillRect(0,0,w,h);
    for(let r=0;r<4;r++) for(let c=0;c<4;c++){ const on=hash(r*5+1,c*3+2)<.55;
      x.fillStyle=on?(hash(c,r+9)<.3?'#fff3c4':'#ffc95c'):'#394154'; x.fillRect(4+c*16,4+r*16,8,9); } }));
}
function setWindows(on){
  if(on===AT.windows) return; AT.windows=on;
  for(const id of blockIds) safe('windows',()=>{ if(!map.getLayer(id)) return;
    map.setPaintProperty(id,'fill-extrusion-pattern',on?'enh-win':undefined); });
}
// headlight beams on the ground ahead of the SUV / tractor
function makeBeams(){
  const c=document.createElement('canvas'); c.width=128; c.height=256; const x=c.getContext('2d');
  for(const cx of [40,88]){ const g=x.createLinearGradient(0,256,0,0); g.addColorStop(0,'rgba(255,244,200,.75)'); g.addColorStop(.55,'rgba(255,240,190,.3)'); g.addColorStop(1,'rgba(255,240,190,0)');
    x.fillStyle=g; x.beginPath(); x.moveTo(cx-5,256); x.lineTo(cx+5,256); x.lineTo(cx+34,0); x.lineTo(cx-34,0); x.closePath(); x.fill(); }
  const tex=new THREE.CanvasTexture(c);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(7,20),new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false,opacity:.9}));
  m.rotation.x=-Math.PI/2; m.position.set(0,.07,-12.4); m.visible=false; car.add(m); return m;
}
function applyAtmos(){
  const W=AT.wx, sp=sunPos(nowDate(),S.lat,S.lng), alt=sp.alt;
  const k=clamp01((6-alt)/14);                                    // 0 in daylight (sun >6 deg), 1 by nautical dusk (-8 deg)
  const gold=alt>-4&&alt<10?1-Math.abs(alt-3)/7:0;                 // warm light around sunrise and sunset
  const wet=W.type?W.int:0, cl=Math.max(AT.cloud,W.fog*.8,wet*.8);
  const key=[k.toFixed(2),gold.toFixed(2),cl.toFixed(2),W.fog.toFixed(2),W.code,POWER?1:0].join();
  AT.k=k; hudLine();
  if(key===AT.lastKey) return; AT.lastKey=key;
  // map darkness and colour
  const br=1-.47*k-.13*cl*(1-k), sat=1-.3*k-.3*cl, sep=.25*gold*(1-cl);
  mapEl.style.filter=(br>.99&&sat>.99&&sep<.01)?'':`brightness(${br.toFixed(3)}) saturate(${sat.toFixed(3)}) sepia(${sep.toFixed(3)})`;
  // sky
  const grey='#b8c2cc';
  let sky=mix('#7ab8ea','#0b1a3a',k), hor=mix('#eaf3fb','#1e2d4f',k);
  if(gold>0){ hor=mix(hor,'#f6a35c',gold*.8*(1-cl)); sky=mix(sky,'#6d7fc4',gold*.3); }
  sky=mix(sky,mix(grey,'#141b2a',k),cl*.75); hor=mix(hor,mix('#dde3ea','#1c2433',k),cl*.75);
  safe('sky',()=>map.setSky({'sky-color':sky,'horizon-color':hor,'fog-color':hor,'sky-horizon-blend':.6,'horizon-fog-blend':.7+.3*W.fog,'fog-ground-blend':.4-.3*W.fog}));
  if(document.body) document.body.style.background=sky;
  // fog bank toward the horizon
  if(fogEl){ fogEl.style.opacity=String(Math.min(.8,W.fog+wet*.25)); fogEl.style.filter=k>.05?`brightness(${(1-.72*k).toFixed(2)})`:''; }
  // buildings lit from the real sun direction; moonlight-blue and dim at night
  safe('light',()=>map.setLight({anchor:'map',position:[1.15,sp.az,Math.max(12,Math.min(80,90-Math.max(alt,8)))],
    color:k>.5?'#a9b8ff':mix('#ffffff','#ffc58a',gold*.7),intensity:.45-.2*k}));
  setWindows(k>.6);
  // the SUV: dimmer, cooler light on the model at night; headlights and brighter tail lights
  safe('carlight',()=>{
    const hemi=scene.children.find(o=>o&&o.isHemisphereLight); if(hemi) hemi.intensity=.85-.5*k-.2*cl*(1-k);
    sun.intensity=.9*(1-k)*(1-.5*cl)+.08;
    headM.color.setHex(k>.35?0xfffbe6:0xf4f8ff); tailOff.color.setHex(k>.35?0xc01820:0x8a1216);
    if(!AT.beams) AT.beams=makeBeams();
  });
  updateBeams(); dirty=true;
}
function updateBeams(){ const b=AT.beams; if(!b) return; const on=AT.k>.35&&(mode==='car'||mode==='tractor');
  if(b.visible!==on){ b.visible=on; dirty=true; } }
onTick(10000,function atmosTick(){ applyAtmos(); });
onTick(300,updateBeams);

// rain, snow and lightning on their own canvas; the loop only runs while something is falling
const WX={parts:[],run:false,last:0,flash:0,nextBolt:0};
function startWx(){
  const W=AT.wx, want=!!W.type||W.thunder;
  if(!wxCv) return;
  if(!want){ WX.parts.length=0; if(WX.run){ WX.run=false; } const x=wxCv.getContext('2d'); x.clearRect(0,0,wxCv.width,wxCv.height); return; }
  const n=Math.round((W.type==='snow'?300:260)*W.int*(POWER?.45:1));
  WX.parts=[]; for(let i=0;i<n;i++) WX.parts.push(newPart(true));
  if(!WX.run){ WX.run=true; WX.last=performance.now(); requestAnimationFrame(wxFrame); }
}
function newPart(anyY){ const w=wxCv.width||innerWidth, h=wxCv.height||innerHeight, snow=AT.wx.type==='snow';
  return {x:Math.random()*w*1.2-w*.1,y:anyY?Math.random()*h:-20-Math.random()*60,v:snow?40+Math.random()*50:650+Math.random()*450,
    l:snow?0:14+Math.random()*16,r:snow?1.2+Math.random()*2:0,ph:Math.random()*6.3,a:.35+Math.random()*.4}; }
function wxFrame(now){
  if(!WX.run) return;
  if(POWER&&now-WX.last<32){ requestAnimationFrame(wxFrame); return; }
  const dt=Math.min(.05,(now-WX.last)/1000); WX.last=now;
  const W=AT.wx, x=wxCv.getContext('2d');
  if(wxCv.width!==innerWidth||wxCv.height!==innerHeight){ wxCv.width=innerWidth; wxCv.height=innerHeight; }
  const w=wxCv.width, h=wxCv.height, drift=(S.steer||0)*-120-40, night=AT.k;
  x.clearRect(0,0,w,h);
  if(W.type==='rain'){ x.strokeStyle=night>.5?'rgba(170,190,220,.55)':'rgba(215,225,240,.6)'; x.lineWidth=1.2; x.beginPath();
    for(const p of WX.parts){ p.y+=p.v*dt; p.x+=drift*dt; const s=p.l/p.v; x.moveTo(p.x,p.y); x.lineTo(p.x-drift*s,p.y-p.l);
      if(p.y>h+20) Object.assign(p,newPart(false)); }
    x.stroke(); }
  else if(W.type==='snow'){ x.fillStyle=night>.5?'rgba(210,220,240,.8)':'rgba(255,255,255,.9)'; x.beginPath();
    for(const p of WX.parts){ p.ph+=dt*1.7; p.y+=p.v*dt; p.x+=(Math.sin(p.ph)*30+drift*.4)*dt; x.moveTo(p.x+p.r,p.y); x.arc(p.x,p.y,p.r,0,6.3);
      if(p.y>h+10) Object.assign(p,newPart(false)); }
    x.fill(); }
  if(W.thunder){                                                  // a flash every 6-20 s, sometimes a double
    if(!WX.nextBolt) WX.nextBolt=now+4000+Math.random()*8000;
    if(now>WX.nextBolt){ WX.flash=.55+Math.random()*.3; WX.nextBolt=now+(Math.random()<.3?180:6000+Math.random()*14000); }
    if(WX.flash>0){ WX.flash=Math.max(0,WX.flash-dt*2.6); } flashEl.style.opacity=WX.flash.toFixed(2); }
  else if(flashEl.style.opacity!=='0') flashEl.style.opacity='0';
  requestAnimationFrame(wxFrame);
}
onReady(function atmosInit(){ windowImage(); applyAtmos(); startWx(); loadWeather(); });


function boot(){
  if(ENH.booted) return; ENH.booted=true;
  for(const f of inits) safe(f.name||'init',f);
  setInterval(()=>{ const now=performance.now(); for(const t of ticks){ if(now-t.t>=t.ms){ t.t=now; safe(t.fn.name||'tick',t.fn); } } },100);
}
if(map.loaded()&&map.isStyleLoaded()) boot(); else map.once('load',boot);
})();
</script>
