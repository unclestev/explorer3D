<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Yorkville Driver</title>
<script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script>window.maplibregl||document.write('<script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/3.6.2/maplibre-gl.js"><\/script>')</script>
<script>window.maplibregl||document.write('<script crossorigin="anonymous" src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"><\/script>')</script>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/3.6.2/maplibre-gl.css" rel="stylesheet">
<script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE||document.write('<script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>')</script>
<link href="css/style.css?v=8" rel="stylesheet">
</head>
<body>
<div id="load">Loading map…</div>
<div id="toast"></div>
<div id="map"></div>
<div id="tint"></div><div id="fog"></div>
<canvas id="car3d"></canvas>
<canvas id="wx"></canvas><div id="flash"></div>
<div id="hud"><div class="spd"><span id="mph">0</span><span class="unit">mph</span><span id="lim"><small>SPEED<br>LIMIT</small><b>--</b></span></div><div id="road">On road</div><div id="place">Locating…</div><div id="wxl"></div><div id="surf"></div><div id="near"></div></div>
<div id="compass" aria-label="Compass"><div id="cDial"><b class="cn">N</b><b class="ce">E</b><b class="cs">S</b><b class="cw">W</b></div><div id="cDest"><i></i></div><i id="cPtr"></i><span id="cHdg">N</span></div>
<div id="findPanel"><form id="findForm"><input id="findQ" type="search" placeholder="Address or place, e.g. Main St, Yorkville" autocomplete="off" enterkeyhint="search"><button type="submit">Go</button><button type="button" id="findX" aria-label="Close search">✕</button></form><div id="findList"></div></div>
<div id="nav"><div id="navArrow">↑</div><div id="navTxt"><b id="navDist"></b><span id="navStreet"></span></div><button id="navAuto" title="Autopilot: drive this route for me">AUTO</button><button id="navX" aria-label="Clear route">✕</button></div>
<div id="zoom"><button id="zi">+</button><button id="zo">−</button><button id="cp" style="font-size:14px">🚗+</button><button id="cm" style="font-size:14px">🚗−</button><button id="pw" title="Battery saver" style="font-size:18px">🔋</button><button id="find" title="Search for a destination" style="font-size:18px">🔍</button></div>
<div id="ctl">
  <div class="track" id="st"><div class="knob" id="stk"></div></div>
  <div id="pedals">
    <div class="pedal brake" id="brake"><div class="fill"></div><span>BRAKE</span></div>
    <div class="pedal gas" id="sp"><div class="fill"></div><span>GAS</span></div>
  </div>
</div>
<script src="js/errors.js?v=3"></script>
<script src="js/game.js?v=12"></script>
<script src="js/enh/core.js?v=3"></script>
<script src="js/enh/roads.js?v=10"></script>
<script src="js/enh/signs.js?v=6"></script>
<script src="js/enh/nav.js?v=9"></script>
<script src="js/enh/atmos.js?v=3"></script>
<script src="js/enh/textures.js?v=7"></script>
<script src="js/enh/search.js?v=9"></script>
<script src="js/enh/autopilot.js?v=11"></script>
<script src="js/enh/boot.js?v=3"></script>
</body>
</html>
