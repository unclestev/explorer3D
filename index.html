<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yorkville 3D Explorer ST</title>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #87CEEB;
            user-select: none; -webkit-user-select: none; 
        }
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        #loading {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a; color: #38bdf8; z-index: 999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; transition: opacity 0.5s;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid rgba(56, 189, 248, 0.3);
            border-top-color: #38bdf8; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* =========================================
           REALISTIC IMAGE RENDERING
           ========================================= */
        #car-container {
            position: absolute; top: 65%; left: 50%;
            /* Dimensions adjusted to fit image_2.png proportions */
            width: 75px; height: 85px; 
            /* The image naturally has a 3D perspective, so it just needs to be centered flat */
            transform: translate(-50%, -50%);
            z-index: 10;
        }
        
        #car-image {
            width: 100%; height: 100%; 
            object-fit: contain;
            filter: drop-shadow(0px 10px 12px rgba(0,0,0,0.6));
        }

        /* Dual Brake Lights corresponding to image_2.png */
        .brake-glow {
            position: absolute; bottom: 28%; width: 10px; height: 18px;
            background: transparent; border-radius: 4px;
            transition: background 0.1s, box-shadow 0.1s;
            z-index: 11;
        }
        #brake-glow-left { left: 4px; }
        #brake-glow-right { right: 4px; }
        
        .braking .brake-glow {
            background: rgba(255, 50, 50, 0.6);
            box-shadow: 0 0 20px 12px rgba(255, 0, 0, 0.85);
        }

        #hud {
            position: absolute; top: 15px; left: 15px; max-width: 240px;
            background: rgba(15, 23, 42, 0.85); color: white; padding: 12px 16px;
            border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.1);
            z-index: 100; pointer-events: none;
        }
        #hud h1 { margin: 0 0 4px 0; font-size: 14px; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px;}
        #hud p { margin: 3px 0; font-size: 12px; color: #cbd5e1; }
        #speed-display { font-size: 20px; font-weight: bold; color: #fff; }

        #zoom-controls {
            position: absolute; top: 15px; right: 15px; z-index: 100;
            display: flex; flex-direction: column; gap: 8px;
        }
        .zoom-btn {
            width: 44px; height: 44px; background: rgba(15, 23, 42, 0.85); color: white;
            border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
            font-size: 24px; font-weight: bold; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); touch-action: none;
        }
        .zoom-btn:active { background: rgba(56, 189, 248, 0.8); transform: scale(0.95); }

        #controls-container {
            position: absolute; bottom: 30px; left: 0; right: 0;
            display: flex; justify-content: space-between; padding: 0 30px;
            align-items: center; 
            z-index: 100; pointer-events: none; touch-action: none;
        }
        
        .slider-track {
            background: rgba(15, 23, 42, 0.6); border: 2px solid rgba(255,255,255,0.2);
            border-radius: 30px; position: relative; pointer-events: auto;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        #steer-track { width: 140px; height: 50px; }
        #speed-track { width: 50px; height: 140px; }

        .slider-knob {
            width: 46px; height: 46px; background: #38bdf8; border-radius: 50%;
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.4);
            border: 2px solid #fff; transition: transform 0.1s ease-out, background 0.2s, border-color 0.2s;
        }

        @media (max-height: 500px) {
            #controls-container { bottom: 15px; padding: 0 15px; }
            #car-container { top: 75%; }
        }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <div>Loading Yorkville Map...</div>
    </div>

    <div id="map"></div>

    <div id="hud">
        <h1>Yorkville Explorer ST</h1>
        <p><span id="speed-display">0</span> MPH</p>
        <p>Loc: <strong id="location-display">Downtown Yorkville</strong></p>
        <p>Area: <span id="area-display">Yorkville, Kendall County</span></p>
    </div>

    <div id="zoom-controls">
        <div class="zoom-btn" id="btn-zoom-in">+</div>
        <div class="zoom-btn" id="btn-zoom-out">−</div>
    </div>

    <!-- User-provided exact vehicle image -->
    <div id="car-container">
        <img id="car-image" src="image_2.png" alt="Ford Explorer ST">
        <div id="brake-glow-left" class="brake-glow"></div>
        <div id="brake-glow-right" class="brake-glow"></div>
    </div>

    <div id="controls-container">
        <div class="slider-track" id="steer-track">
            <div class="slider-knob" id="steer-knob"></div>
        </div>
        <div class="slider-track" id="speed-track">
            <div class="slider-knob" id="speed-knob"></div>
        </div>
    </div>

    <script>
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/liberty', 
            center: [-88.446, 41.642], 
            zoom: 18, pitch: 65, bearing: 0,
            interactive: true, scrollZoom: true, touchZoomRotate: true,
            dragPan: false, dragRotate: false, keyboard: false,
            fadeDuration: 0, 
            crossSourceCollisions: false,
            maxTileCacheSize: 30
        });

        document.getElementById('btn-zoom-in').addEventListener('click', () => {
            map.flyTo({ zoom: map.getZoom() + 1, duration: 300 });
        });
        document.getElementById('btn-zoom-out').addEventListener('click', () => {
            map.flyTo({ zoom: map.getZoom() - 1, duration: 300 });
        });

        // Virtual Joysticks
        let touchSteerValue = 0; 
        let touchSpeedValue = 0; 

        function setupJoystick(trackId, knobId, axis) {
            const track = document.getElementById(trackId);
            const knob = document.getElementById(knobId);
            let activePointerId = null;
            let maxDist = 45;

            function updateKnob(e) {
                if (activePointerId !== e.pointerId) return;
                const rect = track.getBoundingClientRect();
                const center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
                
                if (axis === 'x') {
                    let dx = e.clientX - center.x;
                    touchSteerValue = Math.max(-1, Math.min(1, dx / maxDist));
                    knob.style.transform = `translate(calc(-50% + ${touchSteerValue * maxDist}px), -50%)`;
                    knob.style.transition = 'none';
                } else {
                    let dy = e.clientY - center.y;
                    touchSpeedValue = Math.max(-1, Math.min(1, -dy / maxDist));
                    knob.style.transform = `translate(-50%, calc(-50% - ${touchSpeedValue * maxDist}px))`;
                    knob.style.transition = 'none';
                }
            }
            
            function resetKnob(e) {
                if (activePointerId !== e.pointerId) return;
                activePointerId = null;
                if (axis === 'x') touchSteerValue = 0; else touchSpeedValue = 0;
                knob.style.transition = 'transform 0.2s ease-out';
                knob.style.transform = `translate(-50%, -50%)`;
            }

            track.addEventListener('pointerdown', (e) => {
                activePointerId = e.pointerId;
                track.setPointerCapture(e.pointerId);
                updateKnob(e);
            });
            track.addEventListener('pointermove', updateKnob);
            track.addEventListener('pointerup', resetKnob);
            track.addEventListener('pointercancel', resetKnob);
        }

        setupJoystick('steer-track', 'steer-knob', 'x');
        setupJoystick('speed-track', 'speed-knob', 'y');

        // Physics State
        let car = { 
            lng: -88.446, lat: 41.642, 
            throttle: 0, maxThrottle: 1.0, 
            bearing: 0, turnSpeed: 4.5 
        };

        const BASE_SPEED = 0.00003; 
        const BASE_ZOOM = 18;
        
        // Keyboard State
        const keys = { W: false, A: false, S: false, D: false };
        let kbSteerValue = 0;
        let kbSpeedValue = 0;

        window.addEventListener('keydown', (e) => {
            if (['w', 'W', 'ArrowUp'].includes(e.key)) keys.W = true;
            if (['a', 'A', 'ArrowLeft'].includes(e.key)) keys.A = true;
            if (['s', 'S', 'ArrowDown'].includes(e.key)) keys.S = true;
            if (['d', 'D', 'ArrowRight'].includes(e.key)) keys.D = true;
        });
        window.addEventListener('keyup', (e) => {
            if (['w', 'W', 'ArrowUp'].includes(e.key)) keys.W = false;
            if (['a', 'A', 'ArrowLeft'].includes(e.key)) keys.A = false;
            if (['s', 'S', 'ArrowDown'].includes(e.key)) keys.S = false;
            if (['d', 'D', 'ArrowRight'].includes(e.key)) keys.D = false;
        });

        const carContainer = document.getElementById('car-container');
        const speedKnob = document.getElementById('speed-knob');

        let lastRenderLng = car.lng;
        let lastRenderLat = car.lat;
        let lastRenderBearing = car.bearing;

        function updateGame() {
            // Keyboard Smooth Ramp (simulates analog stick easing)
            if (keys.A) kbSteerValue -= 0.08;
            if (keys.D) kbSteerValue += 0.08;
            if (!keys.A && !keys.D) kbSteerValue *= 0.7; 
            kbSteerValue = Math.max(-1, Math.min(1, kbSteerValue));

            if (keys.W) kbSpeedValue += 0.08;
            if (keys.S) kbSpeedValue -= 0.08;
            if (!keys.W && !keys.S) kbSpeedValue *= 0.7;
            kbSpeedValue = Math.max(-1, Math.min(1, kbSpeedValue));

            // Final Analong Slider Values
            const finalSteer = Math.abs(touchSteerValue) > 0.05 ? touchSteerValue : kbSteerValue;
            const finalGas = Math.abs(touchSpeedValue) > 0.05 ? touchSpeedValue : kbSpeedValue;

            // Knob Colors based on input
            if (finalGas > 0.1) {
                speedKnob.style.background = '#22c55e';
                speedKnob.style.borderColor = '#15803d';
            } else if (finalGas < -0.1) {
                speedKnob.style.background = '#ef4444';
                speedKnob.style.borderColor = '#b91c1c';
            } else {
                speedKnob.style.background = '#38bdf8';
                speedKnob.style.borderColor = '#fff';
            }

            // ==========================================
            // ANALOG THROTTLE ENGINE
            // ==========================================
            let targetThrottle = 0;
            
            // Map the joystick input directly to target speed capacity
            if (finalGas > 0) {
                // 50% push = 50% target max speed
                targetThrottle = finalGas * car.maxThrottle; 
            } else if (finalGas < 0) {
                // Reverse speed is capped at 40%
                targetThrottle = finalGas * 0.4; 
            }

            // Smoothly interpolate current throttle towards the target limit
            car.throttle += (targetThrottle - car.throttle) * 0.05;

            // Deadzone to prevent micro-drifting
            if (Math.abs(car.throttle) < 0.005) {
                car.throttle = 0;
            }

            // Turn physics (scaled so you can't turn aggressively while stopped)
            if (Math.abs(car.throttle) > 0.01) {
                car.bearing += finalSteer * car.turnSpeed * (car.throttle >= 0 ? 1 : -1);
            }

            // Brake Detection: Moving forward but joystick is pulled backwards
            if (car.throttle > 0.05 && finalGas < -0.1) {
                carContainer.classList.add('braking');
                // Apply extra brake friction to slow down faster
                car.throttle *= 0.85; 
            } else {
                carContainer.classList.remove('braking');
            }

            // Apply movement to GPS coordinates
            if (car.throttle !== 0) {
                const currentZoom = map.getZoom();
                const zoomMultiplier = Math.pow(2, BASE_ZOOM - currentZoom); 
                const effectiveSpeed = car.throttle * BASE_SPEED * zoomMultiplier;
                
                const rad = car.bearing * (Math.PI / 180);
                const latCorrection = Math.cos(car.lat * (Math.PI / 180));
                
                car.lat += Math.cos(rad) * effectiveSpeed;
                car.lng += (Math.sin(rad) * effectiveSpeed) / latCorrection; 
            }

            // Render camera updates
            if(map.loaded()){
                const distMoved = Math.abs(car.lng - lastRenderLng) + Math.abs(car.lat - lastRenderLat);
                const bearingDiff = Math.abs(car.bearing - lastRenderBearing);
                
                if (distMoved > 0.0000005 || bearingDiff > 0.1 || car.throttle === 0) {
                    map.jumpTo({ center: [car.lng, car.lat], bearing: car.bearing });
                    lastRenderLng = car.lng;
                    lastRenderLat = car.lat;
                    lastRenderBearing = car.bearing;
                }
            }

            const displayMph = Math.round(Math.abs(car.throttle) * 85); // 85mph max representation
            document.getElementById('speed-display').innerText = displayMph;

            // Real-Time Boundary Detection
            let locName = "Local Roads", cityName = "Yorkville";
            if (car.lng > -88.380 && car.lat >= 41.640) cityName = "Oswego";
            else if (car.lng < -88.485) cityName = "Plano";
            else {
                if (car.lng >= -88.455 && car.lng <= -88.440 && car.lat >= 41.638 && car.lat <= 41.648) locName = "Downtown Yorkville";
                else if (car.lng >= -88.465 && car.lng < -88.445 && car.lat > 41.648 && car.lat <= 41.665) locName = "YHS Campus";
                else if (car.lng >= -88.410 && car.lng <= -88.380 && car.lat >= 41.628 && car.lat < 41.645) locName = "Fields of Farm Colony"; 
                else if (car.lng >= -88.480 && car.lng < -88.446 && car.lat >= 41.600 && car.lat <= 41.632) locName = "Country Hills";
            }
            document.getElementById('location-display').innerText = locName;
            document.getElementById('area-display').innerText = `${cityName}, Kendall County`;

            requestAnimationFrame(updateGame);
        }

        function startGameLoop() {
            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                requestAnimationFrame(updateGame);
            }, 500);
        }

        map.on('load', () => {
            try {
                if (map.getSource('openmaptiles')) {
                    map.addLayer({
                        'id': '3d-buildings',
                        'source': 'openmaptiles',
                        'source-layer': 'building',
                        'type': 'fill-extrusion',
                        'minzoom': 15,
                        'paint': {
                            'fill-extrusion-color': '#e2e8f0',
                            'fill-extrusion-height': ['coalesce', ['get', 'render_height'], ['get', 'height'], 6],
                            'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], ['get', 'min_height'], 0],
                            'fill-extrusion-opacity': 0.85
                        }
                    });
                }
            } catch(e) { }
            startGameLoop();
        });
        
        setTimeout(() => {
            if (document.getElementById('loading').style.display !== 'none') startGameLoop();
        }, 3000);

        window.addEventListener('resize', () => map.resize());
    </script>
</body>
</html>
